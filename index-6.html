<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root{
    --navy:#0B2027; --brass:#C9A227; --teal:#2F6F6B; --rust:#B5533C;
    --blue:#1F5C86; --green:#2F7A4D;
    --paper:#F6F3EA; --card:#FBF9F3; --line:#C7BFA6; --linefaint:#EDE8D9; --muted:#8A8267;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--paper); font-family:'Inter',sans-serif; color:var(--navy);}
  body{padding-bottom:72px; min-height:100vh;}
  .serif{font-family:'Fraunces',serif;}
  .mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
  header.top{background:var(--navy); color:#fff; padding:18px 20px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:30;}
  header.top .badge{width:34px; height:34px; border:2px solid var(--brass); border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden;}
  header.top .badge img{width:100%;height:100%;object-fit:cover;}
  header.top .badge span{font-family:'Fraunces',serif; color:var(--brass); font-size:17px;}
  header.top .title{font-family:'Fraunces',serif; font-size:19px; line-height:1.1;}
  header.top .sub{font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.4);}
  header.top .sub a{color:rgba(255,255,255,.75); text-decoration:underline;}
  header.top .back{background:none; border:none; color:#fff; font-size:22px; padding:0 8px 0 0; cursor:pointer;}
  main{padding:18px;}
  h1.page{font-family:'Fraunces',serif; font-size:22px; margin:0 0 4px;}
  h2.subhead{font-family:'Fraunces',serif; font-size:16px; margin:22px 0 10px;}
  .muted{color:var(--muted); font-size:13px;}
  .card{background:var(--card); border:1.5px solid var(--line); border-radius:6px; position:relative; overflow:hidden;}
  .stat{padding:16px; display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:12px;}
  .stat .label{font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:8px;}
  .stat .value{font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600;}
  .stat .icon{width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .grid3{display:grid; grid-template-columns:1fr; gap:10px; margin-bottom:18px;}
  @media(min-width:520px){.grid3{grid-template-columns:1fr 1fr 1fr;}}
  .grid4{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
  @media(min-width:520px){.grid4{grid-template-columns:1fr 1fr 1fr 1fr;}}
  .row{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--linefaint); font-size:14.5px; cursor:default;}
  .row:last-child{border-bottom:none;}
  .row.clickable{cursor:pointer;}
  .row.clickable:active{background:var(--linefaint);}
  .btn{border:none; border-radius:5px; padding:11px 16px; font-size:14px; font-weight:600; color:#fff; background:var(--teal); display:inline-flex; align-items:center; gap:8px; cursor:pointer;}
  .btn.dark{background:var(--blue);}
  .btn.rust{background:var(--rust);}
  .btn.blue{background:var(--blue);}
  .btn.brass{background:var(--brass); color:var(--navy);}
  .btn.ghost{background:transparent; color:var(--navy); border:1.5px solid var(--line);}
  .btn:disabled{opacity:.4;}
  .btn-full{width:100%; justify-content:center; margin-top:6px;}
  .fab-row{display:flex; justify-content:flex-end; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  table{width:100%; border-collapse:collapse; font-size:13.8px;}
  th{text-align:left; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:10px 12px; border-bottom:2px solid var(--line);}
  td{padding:11px 12px; border-bottom:1.5px solid var(--linefaint); vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .empty{padding:24px 16px; color:var(--muted); font-size:13.5px;}
  .field{display:block; margin-bottom:12px;}
  .field span{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700; margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%; border:1.5px solid var(--line); background:#fff; border-radius:5px; padding:10px 11px; font-size:16px; font-family:inherit; color:var(--navy);}
  .field textarea{resize:vertical; min-height:70px;}
  .field.check{display:flex; align-items:center; gap:8px;}
  .field.check input{width:auto;}
  .field.check span{margin:0; text-transform:none; font-weight:500; font-size:14px; color:var(--navy);}
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; z-index:50;}
  @media(min-width:520px){.modal-bg{align-items:center;}}
  .modal{background:var(--card); width:100%; max-width:480px; border-radius:14px 14px 0 0; border:1.5px solid var(--line); max-height:90vh; overflow-y:auto;}
  @media(min-width:520px){.modal{border-radius:8px;}}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1.5px solid var(--line); position:sticky; top:0; background:var(--card); z-index:2;}
  .modal-head h3{font-family:'Fraunces',serif; margin:0; font-size:17px;}
  .modal-head button{background:none; border:none; font-size:20px; color:var(--muted); cursor:pointer;}
  .modal-body{padding:18px;}
  .pill{font-size:11px; padding:3px 10px; border-radius:99px; font-weight:700; white-space:nowrap; display:inline-block;}
  .type-toggle{display:flex; gap:8px;}
  .thumb-tap:active{transform:scale(1.12);}
  @keyframes zoomPop{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}
  .zoom-pop-img{animation:zoomPop .18s ease-out;}
  .type-toggle button{flex:1; padding:9px; border-radius:5px; border:1.5px solid var(--line); background:#fff; font-weight:600; font-size:13.5px; cursor:pointer;}
  nav.bottom{position:fixed; bottom:0; left:0; right:0; background:var(--navy); display:flex; z-index:40; border-top:1px solid rgba(255,255,255,.08);}
  nav.bottom button{flex:1; background:none; border:none; color:rgba(255,255,255,.55); padding:9px 2px 8px; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; font-family:inherit; cursor:pointer;}
  nav.bottom button.active{color:var(--brass);}
  nav.bottom svg{width:19px; height:19px;}
  .icon-btn{background:none; border:none; cursor:pointer; padding:5px;}
  .icon-btn svg{width:19px; height:19px; display:block;}
  .icon-btn.trash{color:var(--rust);}
  .icon-btn.edit{color:var(--teal);}
  .lineitem{border:1.5px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px; background:#fff; position:relative;}
  .lineitem .top-row{display:flex; gap:8px; align-items:flex-end; margin-bottom:8px;}
  .mic-btn{width:38px; height:38px; border-radius:50%; border:none; background:var(--teal); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer;}
  .btn-compact{padding:14px 10px !important; font-size:13.5px !important; gap:6px !important; line-height:1.25;}
  .btn-compact svg{width:16px; height:16px; flex-shrink:0;}
  .btn svg{width:16px; height:16px; flex-shrink:0;}
  .mic-btn.listening{background:var(--rust); animation:pulse 1s infinite;}
  .mic-big{width:64px; height:64px; font-size:0;}
  .mic-big svg{width:28px; height:28px;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
  .kdv-row{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); margin-bottom:6px;}
  .kdv-row input[type=checkbox]{width:auto;}
  .kdv-row input[type=number]{width:60px; padding:5px 7px;}
  .line-remove{position:absolute; top:8px; right:8px; background:none; border:none; color:var(--muted); cursor:pointer;}
  .line-total{text-align:right; font-size:13px; color:var(--navy); font-weight:600;}
  .voice-hint{font-size:11.5px; color:var(--muted); margin-top:-4px; margin-bottom:10px;}
  .thumb{width:36px; height:36px; border-radius:5px; object-fit:cover; border:1.5px solid var(--line); flex-shrink:0;}
  .avatar{width:44px; height:44px; border-radius:50%; object-fit:cover; border:1.5px solid var(--line); flex-shrink:0; background:var(--linefaint);}
  .voice-cta{padding:18px; text-align:center; margin-bottom:18px; border:2px dashed var(--brass);}
  .voice-cta .mic-big{margin:0 auto 10px;}
  .kv-hint{font-size:12px; color:var(--muted); margin-top:4px;}
  .overdue-tag{font-size:11px; color:var(--rust); font-weight:700; margin-top:2px;}
  .date-strong{color:var(--navy); font-weight:700; font-size:13.5px;}
  .reminder-row{display:flex; justify-content:space-between; align-items:center; padding:11px 16px; border-bottom:1.5px solid var(--linefaint); cursor:pointer;}
  .reminder-row:last-child{border-bottom:none;}
  .reminder-row:active{background:var(--linefaint);}
  .badge-days{font-size:11px; font-weight:700; padding:4px 10px; border-radius:99px; color:#fff; white-space:nowrap;}
  a.tel-link{color:var(--blue); text-decoration:none; font-weight:600;}
  .product-pick{display:flex; align-items:center; gap:10px; border:1.5px solid var(--line); border-radius:6px; padding:10px; background:#fff; cursor:pointer; margin-bottom:8px;}
  .product-pick .ph{width:40px;height:40px;border-radius:6px;background:var(--linefaint);display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;}
  #login-screen, #register-screen{position:fixed;inset:0;background:var(--navy);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;}
  #login-screen .box, #register-screen .box{background:var(--card);border-radius:10px;padding:28px 24px;width:100%;max-width:360px;margin:auto;}
  #register-screen .box{max-width:420px;}
  #login-screen h1, #register-screen h1{font-family:'Fraunces',serif;font-size:22px;margin:0 0 4px;color:var(--navy);}
  #login-screen p.sub, #register-screen p.sub{color:var(--muted);font-size:12.5px;margin:0 0 20px;}
  #login-screen label, #register-screen label{display:block;margin-bottom:14px;}
  #login-screen label span, #register-screen label span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:5px;}
  #login-screen input, #register-screen input{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:5px;padding:11px 12px;font-size:16px;font-family:inherit;color:var(--navy);}
  #login-screen .err, #register-screen .err{color:var(--rust);font-size:12.5px;margin:-4px 0 14px;min-height:16px;}
  #login-screen button, #register-screen button{width:100%;border:none;border-radius:6px;padding:12px;font-size:14.5px;font-weight:700;color:#fff;background:var(--teal);cursor:pointer;}
  #login-screen button:disabled, #register-screen button:disabled{opacity:.6;}
  #register-screen .reg-section{font-size:13px;font-weight:800;color:#fff;background:var(--teal);border-radius:6px;padding:8px 12px;margin:18px 0 12px;}
  #register-screen .reg-section:first-of-type{margin-top:4px;}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://rxzfhkbgzcbudiknidyb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_dmbxSVojZ4uKxdGDISuTYQ_V74mOYFN';
const sb = (typeof supabase!=='undefined') ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
let FIRMA_ID = null;
let currentFirmaSektor = 'petshop';
let currentMusteriId = null;
let currentMusteriName = '';
let authScreen = 'login'; // 'login' | 'register'
let currentUser = null;
let currentUserRole = null;

async function initAuth(){
  if(!sb){ document.getElementById('login-error').textContent = 'Bağlantı hatası. İnternetinizi kontrol edin.'; document.getElementById('login-screen').style.display='flex'; return; }
  const { data } = await sb.auth.getSession();
  if(data && data.session && data.session.user){
    await onLoggedIn(data.session.user);
  } else {
    document.getElementById('login-screen').style.display='flex';
  }
  sb.auth.onAuthStateChange((event, session)=>{
    if(event==='SIGNED_OUT'){
      currentUser = null; currentUserRole = null; FIRMA_ID = null; currentMusteriId = null; currentMusteriName = ''; musteriHareketlerCache = null;
      document.getElementById('app-shell').style.display='none';
      document.getElementById('login-screen').style.display='flex';
      toggleAuthScreen('login');
    }
  });
}

async function submitLogin(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  errEl.textContent = '';
  if(!email || !password){ errEl.textContent = 'E-posta ve şifre gerekli.'; return; }
  btn.disabled = true; btn.textContent = 'Giriş yapılıyor…';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'Giriş Yap';
  if(error){ errEl.textContent = 'E-posta veya şifre hatalı.'; return; }
  await onLoggedIn(data.user);
}

async function onLoggedIn(user){
  currentUser = user;
  let role = 'patron';
  try{
    const { data: roleRow } = await sb.from('kullanici_rolleri').select('rol, firma_id, musteri_id').ilike('email', user.email).maybeSingle();
    if(roleRow && roleRow.rol) role = roleRow.rol;
    if(roleRow && roleRow.firma_id) FIRMA_ID = roleRow.firma_id;
    if(roleRow && roleRow.musteri_id) currentMusteriId = roleRow.musteri_id;
  }catch(e){ console.error('Rol okunamadı:', e); }
  currentUserRole = role;
  if(!FIRMA_ID){
    document.getElementById('login-screen').style.display='flex';
    document.getElementById('login-error').textContent = 'Hesabınız henüz bir firmaya bağlanmamış. Lütfen yönetici ile iletişime geçin.';
    sb.auth.signOut();
    return;
  }
  try{
    const { data: firmaRow } = await sb.from('firmalar').select('sektor').eq('id', FIRMA_ID).maybeSingle();
    if(firmaRow && firmaRow.sektor) currentFirmaSektor = firmaRow.sektor;
  }catch(e){ console.error('Firma sektörü okunamadı:', e); }
  if(currentUserRole==='musteri' && currentMusteriId){
    try{
      const { data: mRow } = await sb.from('musteriler').select('ad').eq('id', currentMusteriId).maybeSingle();
      if(mRow) currentMusteriName = mRow.ad;
    }catch(e){ console.error('Müşteri adı okunamadı:', e); }
    orderFormMode = 'existing';
    orderFormCustomerId = currentMusteriId;
  }
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-shell').style.display='block';
  if(currentUserRole==='mudur'){ view = 'siparisMudur'; }
  else if(currentUserRole==='musteri'){ view = 'musteriAna'; }
  render();
}

function logout(){
  sb.auth.signOut();
}
async function submitRegister(){
  const code = document.getElementById('reg-code').value.trim();
  const name = document.getElementById('reg-name').value.trim();
  const company = document.getElementById('reg-company').value.trim();
  const phone = document.getElementById('reg-phone').value.trim();
  const address = document.getElementById('reg-address').value.trim();
  const taxId = document.getElementById('reg-taxid').value.trim();
  const taxOffice = document.getElementById('reg-taxoffice').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  const errEl = document.getElementById('register-error');
  const btn = document.getElementById('register-btn');
  errEl.textContent = '';
  if(!code || !name || !phone || !email || !password){ errEl.textContent = 'Davet kodu, ad soyad, telefon, e-posta ve şifre gerekli.'; return; }
  btn.disabled = true; btn.textContent = 'Kayıt yapılıyor…';
  try{
    const { data: existingRole } = await sb.from('kullanici_rolleri').select('rol').eq('email', email).maybeSingle();
    if(existingRole && (existingRole.rol==='patron' || existingRole.rol==='mudur')){
      errEl.textContent = 'Bu e-posta adresi zaten bir yönetici hesabına ait. Müşteri kaydı için farklı bir e-posta kullanın.';
      btn.disabled = false; btn.textContent = 'Kayıt Ol';
      return;
    }
    const { data: musteriRow, error: findErr } = await sb.from('musteriler').select('id, firma_id, ad').eq('portal_kodu', code.toUpperCase()).maybeSingle();
    if(findErr || !musteriRow){ errEl.textContent = 'Davet kodu bulunamadı. Toptancınızla iletişime geçin.'; btn.disabled=false; btn.textContent='Kayıt Ol'; return; }
    const { data: signUpData, error: signUpErr } = await sb.auth.signUp({ email, password });
    if(signUpErr){ errEl.textContent = signUpErr.message; btn.disabled=false; btn.textContent='Kayıt Ol'; return; }
    const finalName = company ? `${company} (${name})` : name;
    const { error: updErr } = await sb.from('musteriler').update({
      ad: finalName, telefon: phone||null, adres: address||null, vergi_no: taxId||null, vergi_dairesi: taxOffice||null
    }).eq('id', musteriRow.id);
    if(updErr) console.error('Müşteri bilgileri güncellenemedi:', updErr.message);
    const { error: roleErr } = await sb.from('kullanici_rolleri').upsert({ email, rol:'musteri', firma_id: musteriRow.firma_id, musteri_id: musteriRow.id, ad: finalName }, { onConflict: 'email' });
    if(roleErr){ errEl.textContent = 'Kayıt oluşturuldu ama rol bağlanamadı: ' + roleErr.message; btn.disabled=false; btn.textContent='Kayıt Ol'; return; }
    btn.disabled = false; btn.textContent = 'Kayıt Ol';
    if(signUpData.session){
      await onLoggedIn(signUpData.user);
    } else {
      alert('Kayıt başarılı! E-postanıza gelen doğrulama linkine tıklayıp giriş yapın.');
      toggleAuthScreen('login');
    }
  }catch(e){
    errEl.textContent = 'Bir hata oluştu: ' + e.message;
    btn.disabled = false; btn.textContent = 'Kayıt Ol';
  }
}
</script>

<div id="login-screen" style="display:none;">
  <div class="box">
    <h1>Defterim</h1>
    <p class="sub">Devam etmek için giriş yapın</p>
    <label><span>E-posta</span><input id="login-email" type="email" autocomplete="username"></label>
    <label><span>Şifre</span><div style="position:relative;"><input id="login-password" type="password" autocomplete="current-password" style="padding-right:44px;"><button type="button" onclick="togglePwVisibility('login-password', this)" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:18px;cursor:pointer;padding:6px;width:auto;">👁️</button></div></label>
    <p style="text-align:center;margin:-6px 0 6px;"><a href="javascript:void(0)" onclick="submitForgotPassword()" style="color:var(--teal,#0b7a75);font-size:13px;font-weight:600;">Şifremi unuttum</a></p>
    <div class="err" id="login-error"></div>
    <button id="login-btn" onclick="submitLogin()">Giriş Yap</button>
    <a href="javascript:void(0)" onclick="toggleAuthScreen('register')" style="display:block;text-align:center;margin-top:18px;padding:14px;font-size:17px;font-weight:800;color:#fff;background:var(--teal,#0b7a75);border-radius:8px;">Müşteri misiniz? Kayıt Ol</a>
  </div>
</div>
<div id="register-screen" style="display:none;">
  <div class="box">
    <h1>Defterim</h1>
    <p class="sub">Toptancınızdan aldığınız davet koduyla kayıt olun</p>

    <div class="reg-section">🔑 Davet Kodu</div>
    <label><span>Toptancınızdan aldığınız kod</span><input id="reg-code" type="text" autocapitalize="off" autocorrect="off" placeholder="Örn. 4A7K2P"></label>

    <div class="reg-section">👤 Kişisel / İşyeri Bilgileri</div>
    <label><span>Ad Soyad</span><input id="reg-name" type="text" placeholder="Adınız Soyadınız"></label>

const round2 = n => Math.round((Number(n)||0)*100)/100;
function liveFormatAmount(el){
  let raw = el.value;
  if(raw==='' ){ return; }
  const commaIdx = raw.indexOf(',');
  let intPart, decPart=null;
  if(commaIdx>=0){ intPart = raw.slice(0,commaIdx).replace(/[^\d]/g,''); decPart = raw.slice(commaIdx+1).replace(/[^\d]/g,'').slice(0,2); }
  else { intPart = raw.replace(/[^\d]/g,''); }
  if(intPart===''){ el.value = decPart!=null? ','+decPart : ''; return; }
  intPart = intPart.replace(/^0+(?=\d)/,'');
  let formatted = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  if(decPart!=null) formatted += ',' + decPart;
  else if(raw.trim().endsWith(',')) formatted += ',';
  el.value = formatted;
}
function parseAmount(raw){
  if(raw==null) return 0;
  let s = String(raw).trim();
  if(s==='') return 0;
  const hasComma = s.includes(',');
  if(hasComma){
    s = s.replace(/\./g,'').replace(',', '.');
  } else {
    const dotCount = (s.match(/\./g)||[]).length;
    if(dotCount>=2){
      const lastIdx = s.lastIndexOf('.');
      const intPart = s.slice(0,lastIdx).replace(/\./g,'');
      const decPart = s.slice(lastIdx+1);
      s = intPart + '.' + decPart;
    } else if(dotCount===1){
      const parts = s.split('.');
      if(parts[1].length===3){ s = parts.join(''); }
    }
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

}

// ---------- çöp kutusu (son silinenler) ----------
function trashAdd(type, payload){
  state.trash.unshift({id:uid(), type, deletedAt:today(), payload});
  persist();
}
function permanentDeleteTrash(trashId){
  requirePin(()=>{ state.trash = state.trash.filter(x=>x.id!==trashId); persist(); render(); });
}
function restoreTrash(trashId){
  const t = state.trash.find(x=>x.id===trashId); if(!t) return;
  if(t.type==='siparis' || t.type==='siparis-yedek'){
    sb.from('siparisler').upsert(t.payload).then(({error})=>{
      if(error){ alert('Geri yüklenemedi: '+error.message); return; }
      state.trash = state.trash.filter(x=>x.id!==trashId);
      persist();
      loadOrderPageData(true);
      render();
    });
    return;
  }
  if(t.type==='customer'){
    state.customers.push(t.payload.customer);
    (t.payload.movements||[]).forEach(m=>{
      state.movements.push(m);
      if(m.type==='teslim' && m.items){ m.items.forEach(it=>{ if(it.productId){ const p=state.products.find(p=>p.id===it.productId); if(p&&p.stock!=null) p.stock=Math.max(0,p.stock-it.qty); } }); }
    });
  } else if(t.type==='product'){ state.products.push(t.payload); }
  else if(t.type==='ledger'){ state.ledger.push(t.payload); }
  else if(t.type==='movement'){
    state.movements.push(t.payload);
    if(t.payload.type==='teslim' && t.payload.items){ t.payload.items.forEach(it=>{ if(it.productId){ const p=state.products.find(p=>p.id===it.productId); if(p&&p.stock!=null) p.stock=Math.max(0,p.stock-it.qty); } }); }
  }
  else if(t.type==='supplier'){
    state.suppliers.push(t.payload.supplier);
    (t.payload.movements||[]).forEach(m=> state.supplierMovements.push(m));
  }
  else if(t.type==='supplierMovement'){ state.supplierMovements.push(t.payload); }
  else if(t.type==='customerReset'){
    (t.payload.movements||[]).forEach(m=>{
      state.movements.push(m);
      if(m.type==='teslim' && m.items){ m.items.forEach(it=>{ if(it.productId){ const p=state.products.find(p=>p.id===it.productId); if(p&&p.stock!=null) p.stock=Math.max(0,p.stock-it.qty); } }); }
    });
  }
  else if(t.type==='employee'){
    state.employees.push(t.payload.employee);
    (t.payload.movements||[]).forEach(m=> state.employeeMovements.push(m));
  }
  else if(t.type==='employeeMovement'){ state.employeeMovements.push(t.payload); }
  else if(t.type==='bankLoan'){
    state.bankLoans.push(t.payload.bankLoan);
    (t.payload.movements||[]).forEach(m=> state.bankLoanMovements.push(m));
  }
  else if(t.type==='bankLoanMovement'){ state.bankLoanMovements.push(t.payload); }
  state.trash = state.trash.filter(x=>x.id!==trashId);
  persist(); render();
}
function trashLabel(t){
  if(t.type==='siparis') return `Sipariş: ${t.payload.musteri_adi||'Bilinmeyen'} — ${fmtDate(t.payload.created_at||today())}`;
  if(t.type==='siparis-yedek') return `Sipariş Yedeği (düzenleme öncesi): ${t.payload.musteri_adi||'Bilinmeyen'} — ${fmtDate(t.payload.created_at||today())}`;
  if(t.type==='customer') return `Müşteri: ${t.payload.customer.name}`;
  if(t.type==='product') return `Ürün: ${t.payload.name}`;
  if(t.type==='ledger') return `${t.payload.type==='gelir'?'Gelir':'Gider'}: ${t.payload.desc} — ₺${tl(t.payload.amount)}`;
  if(t.type==='movement') return `${t.payload.type==='teslim'?'Teslimat':'Ödeme'}: ${t.payload.desc||''} — ₺${tl(t.payload.total)}`;
  if(t.type==='supplier') return `Tedarikçi: ${t.payload.supplier.name}`;
  if(t.type==='supplierMovement') return `Tedarikçi ${t.payload.type==='borc'?'Borç':'Ödeme'}: ${t.payload.desc} — ₺${tl(t.payload.amount)}`;
  if(t.type==='employee') return `Çalışan: ${t.payload.employee.name}`;
  if(t.type==='employeeMovement') return `Çalışan ${t.payload.type==='borc'?'Hakediş':(t.payload.type==='kesinti'?'Kesinti':'Ödeme')}: ${t.payload.desc} — ₺${tl(t.payload.amount)}`;
  if(t.type==='bankLoan') return `Banka: ${t.payload.bankLoan.name}`;
  if(t.type==='bankLoanMovement') return `Banka ${t.payload.type==='borc'?'Kredi':'Ödeme'}: ${t.payload.desc} — ₺${tl(t.payload.amount)}`;
  if(t.type==='customerReset') return `Hesap Sıfırlama: ${t.payload.customerName} (${(t.payload.movements||[]).length} hareket)`;
  return 'Kayıt';
}

function customerMovements(id){ return state.movements.filter(m=>m.customerId===id).sort((a,b)=> new Date(a.date)-new Date(b.date) || a.id.localeCompare(b.id)); }
function customerTotals(id){
  const ms = state.movements.filter(m=>m.customerId===id);
  const totalDelivered = ms.filter(m=>m.type==='teslim').reduce((a,m)=>a+m.total,0);
  const totalPaid = ms.filter(m=>m.type==='odeme').reduce((a,m)=>a+m.total,0);
  return { totalDelivered, totalPaid, balance: totalDelivered-totalPaid };
}
function customerBalance(id){ return customerTotals(id).balance; }
function customerOpenDeliveries(id){
  // FIFO: en eski teslimattan başlayarak ödemeleri düşer, gerçekten hâlâ açık (kısmen/tamamen ödenmemiş) teslimatları döner
  const ms = customerMovements(id);
  const deliveries = ms.filter(m=>m.type==='teslim').slice().sort((a,b)=> (a.date||'').localeCompare(b.date||''));
  let paidPool = ms.filter(m=>m.type==='odeme').reduce((a,m)=>a+(m.total||0),0);
  const open = [];
  for(const d of deliveries){
    let remaining = d.total||0;
    if(paidPool>0){ const applied = Math.min(paidPool, remaining); paidPool -= applied; remaining -= applied; }
    if(remaining>0.01) open.push({ ...d, openAmount: remaining });
  }
  return open;
}
function customerStarRating(id){
  const bal = customerBalance(id);
  if(bal<=0) return 5;
  const movs = customerMovements(id).filter(m=>m.type==='teslim' && m.dueDate);
  if(!movs.length) return 4;
  const open = customerOpenDeliveries(id).filter(m=>m.dueDate);
  const overdue = open.filter(m=>m.dueDate < today());
  if(!open.length) return 4;
  const ratio = overdue.length / open.length;
  if(ratio===0) return 4;
  if(ratio<0.34) return 3;
  if(ratio<0.67) return 2;
  return 1;
}
function renderStars(n){
  let s = '';
  for(let i=1;i<=5;i++){ s += i<=n ? '★' : '☆'; }
  return `<span style="color:var(--brass);letter-spacing:1px;font-size:13px;">${s}</span>`;
}
function customerOverdue(id){
  const bal = customerBalance(id); if(bal<=0) return null;
  const overdue = customerOpenDeliveries(id).filter(m=>m.dueDate && m.dueDate < today());
  if(!overdue.length) return null;
  overdue.sort((a,b)=> a.dueDate.localeCompare(b.dueDate));
  return overdue[0].dueDate;
}
function productDisplayName(itemName){
  const p = state.products.find(pr=>pr.name===itemName);
  return (p && p.shortLabel) ? p.shortLabel : itemName;
}
function splitNameAndSize(label){
  const m = label.match(/(.*?)(\d+[.,]?\d*)\s*(litre|lt|l\b|kg|kilo)(.*)$/i);
  if(!m) return { core: label.trim(), size: '' };
  const size = `${m[2]}${/kg|kilo/i.test(m[3])?'KG':'L'}`;
  const core = (m[1]+m[4]).replace(/\s+/g,' ').trim();
  return { core: core || label.trim(), size };
}
function customerStatementLines(id){
  const c = state.customers.find(x=>x.id===id); if(!c) return null;
  const rows = customerMovements(id);
  const lines = [`${c.name} — Cari Hesap Özeti`, `Tarih: ${fmtDate(today())}`, ''];
  let grandProductTotal = 0;
  const deliveries = rows.filter(m=>m.type==='teslim');
  const payments = rows.filter(m=>m.type==='odeme');
  if(!rows.length){ lines.push('Henüz hareket yok.'); }
  else {
    let allItems = [];
    deliveries.forEach(m=>{ if(m.items && m.items.length) m.items.forEach(it=>{ allItems.push({qty: it.qty, price: it.unitPrice, total: it.lineTotal}); }); });
    const qtyW = Math.max(2, ...allItems.map(it=>String(it.qty).length), 0);
    const priceW = Math.max(3, ...allItems.map(it=>tlShort(it.price).length), 0);
    const totalW = Math.max(4, ...allItems.map(it=>tlShort(it.total).length), 0);
    const CONN1 = ' Ad × ', CONN2 = ' = ';
    const lineW = qtyW + CONN1.length + priceW + CONN2.length + totalW;
    if(deliveries.length){
      deliveries.forEach(m=>{
        lines.push(fmtDate(m.date));
        if(m.items && m.items.length){
          m.items.forEach(it=>{
            grandProductTotal += it.qty;
            lines.push(it.name);
            lines.push(`${String(it.qty).padStart(qtyW)}${CONN1}${tlShort(it.unitPrice).padStart(priceW)}${CONN2}${tlShort(it.lineTotal).padStart(totalW)}`);
          });
        } else if(m.desc){ lines.push(m.desc); }
        lines.push(`Toplam:`.padEnd(lineW - totalW) + `${tlShort(m.total).padStart(totalW)}`);
        lines.push('-'.repeat(lineW));
      });
    }
    if(payments.length){
      payments.forEach(m=>{
        lines.push(`${fmtDate(m.date)}  Ödeme${m.desc?' — '+m.desc:''}: ₺${tlShort(m.total)}`);
      });
      lines.push('');
    }
  }
  const bal = customerBalance(id);
  lines.push('━━━━━━━━━━━━━━━━━━━━');
  lines.push(bal>0 ? `TOPLAM KALAN BORÇ: ₺${tlShort(bal)}` : (bal<0 ? `FAZLA ÖDEME: ₺${tlShort(Math.abs(bal))}` : 'HESAP KAPALI (borç yok)'));
  if(grandProductTotal>0) lines.push(`TOPLAM VERİLEN ÜRÜN: ${grandProductTotal} adet`);
  const pendingActive = (c.pendingItems||[]).filter(i=>!i.delivered);
  if(pendingActive.length){
    lines.push('');
    lines.push('TESLİM BEKLEYEN ÜRÜNLER:');
    let pendTotalValue = 0;
    pendingActive.forEach(i=>{ const fu=pendFinalUnitPrice(i); const val=fu*i.qty; pendTotalValue+=val; lines.push(`   ${i.name}: ${i.qty} ${i.unit}${i.price?` × ₺${tlShort(fu)}${i.kdvOn?' (KDV dahil)':''} = ₺${tlShort(val)}`:''}`); });
    if(pendTotalValue>0) lines.push(`   Toplam Değer: ₺${tlShort(pendTotalValue)} (ciroya dahil değil)`);
  }
  const deliveredToday = (c.pendingItems||[]).filter(i=>i.delivered && i.deliveredDate===today());
  if(deliveredToday.length){
    lines.push('');
    lines.push(`BUGÜN TESLİM EDİLEN (${fmtDate(today())}):`);
    const unitTotals2 = {};
    deliveredToday.forEach(i=>{ lines.push(`   ${i.qty} ${i.unit} × ${i.name}`); unitTotals2[i.unit] = (unitTotals2[i.unit]||0) + i.qty; });
    const totalsText2 = Object.keys(unitTotals2).map(u=>`${unitTotals2[u]} ${u}`).join(', ');
    lines.push(`   Toplam: ${totalsText2}`);
  }
  return { title: c.name+' — Cari Hesap', text: lines.join('\n') };
}
function printStatementText(title, text){
  const w = window.open('', '_blank');
  if(!w){ alert('Yazdırma penceresi açılamadı, tarayıcı ayarlarınızı kontrol edin.'); return; }
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${esc(title)}</title>
    <style>body{font-family:-apple-system,sans-serif;padding:24px;color:#0B2027;} h1{font-size:18px;margin-bottom:16px;} pre{white-space:pre-wrap;font-family:'Courier New',monospace;font-size:15.5px;line-height:1.7;}</style>
    </head><body><h1>${esc(title)}</h1><pre>${esc(text)}</pre></body></html>`);
  w.document.close();
  setTimeout(()=>{ w.focus(); w.print(); }, 300);
}
function shareCustomerStatement(id){
  const st = customerStatementLines(id); if(!st) return;
  const c = state.customers.find(x=>x.id===id);
  const wp = c ? waPhone(c.phone) : '';
  if(!wp){
    // Numara yoksa doğrudan genel paylaşım menüsüne düş
    sendStatementViaOtherShare(id);
    return;
  }
  openShareChoiceModal('Hesap Özetini Gönder', c, `sendStatementToCustomer('${id}')`, `sendStatementViaOtherShare('${id}')`);
}

function sendStatementToCustomer(id){
  const st = customerStatementLines(id); if(!st) return;
  const c = state.customers.find(x=>x.id===id);
  const text = '```\n' + st.text + '\n```';
  const wp = waPhone(c.phone);
  const waUrl = `https://wa.me/${wp}?text=${encodeURIComponent(text)}`;
  if(waUrl.length > 1900){
    window.open(`https://wa.me/${wp}`, '_blank');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>alert('Hesap özeti uzun olduğu için otomatik doldurulamadı — panoya kopyalandı, WhatsApp açıldı, yapıştırıp gönderebilirsiniz.')).catch(()=>{});
    } else { alert('Hesap özeti uzun olduğu için otomatik doldurulamadı. WhatsApp açıldı, aşağıdaki metni elle yapıştırın:\n\n'+text); }
  } else {
    window.open(waUrl, '_blank');
  }
}
function sendStatementViaOtherShare(id){
  const st = customerStatementLines(id); if(!st) return;
  const text = '```\n' + st.text + '\n```';
  if(navigator.share){ navigator.share({title: st.title, text}).catch(()=>{}); }
  else if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>alert('Hesap özeti kopyalandı, WhatsApp veya başka bir yere yapıştırabilirsiniz.')).catch(()=>alert(text));
  } else { alert(text); }
}
function printCustomerStatement(id){
  const st = customerStatementLines(id); if(!st) return;
  printStatementText(st.title, st.text);
}
function resetCustomerAccount(id){
  const c = state.customers.find(x=>x.id===id); if(!c) return;
  requirePin(()=>{
    const ms = state.movements.filter(m=>m.customerId===id);
    if(!ms.length){ alert('Zaten hiç hareketi yok.'); return; }
    ms.forEach(m=>revertStock(m));
    trashAdd('customerReset', {customerId:id, customerName:c.name, movements:ms});
    state.movements = state.movements.filter(m=>m.customerId!==id);
    persist(); closeModal(); render();
  });
}

function acctMonthsElapsed(startDate){
  const s = new Date(startDate), n = new Date(today());
  let months = (n.getFullYear()-s.getFullYear())*12 + (n.getMonth()-s.getMonth());
  if(n.getDate() < s.getDate()) months--;
  return Math.max(0, months+1);
}
function acctClientPaid(clientId){
  return (state.accountingPayments||[]).filter(p=>p.clientId===clientId).reduce((a,p)=>a+p.amount,0);
}
function acctClientOwed(client){
  return acctMonthsElapsed(client.startDate) * (client.monthlyFee||0);
}
function acctClientBalance(client){
  return acctClientOwed(client) - acctClientPaid(client.id);
}
function acctClientStatementLines(clientId){
  const c = state.accountingClients.find(x=>x.id===clientId); if(!c) return null;
  const months = acctMonthsElapsed(c.startDate);
  const owed = acctClientOwed(c);
  const payments = (state.accountingPayments||[]).filter(p=>p.clientId===c.id).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const lines = [`${c.name}${c.companyName?' — '+c.companyName:''} — Cari Hesap Özeti`, `Tarih: ${fmtDate(today())}`, ''];
  lines.push(`Aylık Ücret: ₺${tlShort(c.monthlyFee)} — Anlaşma: ${fmtDate(c.startDate)} (${months} ay geçti)`);
  lines.push(`Toplam Tahakkuk: ₺${tlShort(owed)}`);
  lines.push('');
  if(payments.length){
    lines.push('ÖDEMELER');
    payments.forEach((p,idx)=>{ lines.push(`${idx+1}) ${fmtDate(p.date)}${p.desc?' — '+p.desc:''}: ₺${tlShort(p.amount)}`); });
    lines.push('');
    lines.push(`Ödeme Toplamı: ₺${tlShort(acctClientPaid(c.id))}`);
  }
  const bal = acctClientBalance(c);
  lines.push('━━━━━━━━━━━━━━━━━━━━');
  lines.push(bal>0 ? `KALAN ALACAK: ₺${tlShort(bal)}` : (bal<0 ? `FAZLA ÖDENEN: ₺${tlShort(Math.abs(bal))}` : 'HESAP KAPALI'));
  return { title: c.name+' — Cari Hesap', text: lines.join('\n') };
}
function shareAcctClientStatement(id){
  const st = acctClientStatementLines(id); if(!st) return;
  const text = '```\n' + st.text + '\n```';
  if(navigator.share){ navigator.share({title: st.title, text}).catch(()=>{}); }
  else if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>alert('Hesap özeti kopyalandı.')).catch(()=>alert(text));
  } else { alert(text); }
}
function printAcctClientStatement(id){
  const st = acctClientStatementLines(id); if(!st) return;
  printStatementText(st.title, st.text);
}

function buildSupplierStatementText(id){
  const s = state.suppliers.find(x=>x.id===id); if(!s) return '';
  const rows = supplierMovementsOf(id);
  let running = 0;
  const lines = [`${s.name} — Tedarikçi Hesap Özeti`, `Tarih: ${fmtDate(today())}`, ''];
  if(!rows.length){ lines.push('Henüz hareket yok.'); }
  else {
    rows.forEach((m, idx)=>{
      const prevRunning = running;
      running += m.type==='borc' ? m.amount : -m.amount;
      const label = m.type==='borc' ? (m.desc||'Mal/Borç') : (m.desc||'Ödeme');
      lines.push(`${fmtDate(m.date)}: ${label} — ${tl(m.amount)}`);
      if(idx===0){ lines.push(`   = ${tl(running)}`); }
      else { lines.push(`   ${tl(prevRunning)} ${m.type==='borc'?'+':'−'} ${tl(m.amount)} = ${tl(running)}`); }
    });
  }
  const bal = supplierBalance(id);
  lines.push('');
  lines.push(bal>0 ? `ONLARA KALAN BORCUMUZ: ${tl(bal)}` : (bal<0 ? `FAZLA ÖDEDİĞİMİZ: ${tl(Math.abs(bal))}` : 'HESAP KAPALI (borç yok)'));
  return lines.join('\n');
}

  const s = state.suppliers.find(x=>x.id===id); if(!s) return;
  const text = buildSupplierStatementText(id);

    if(navigator.share){ navigator.share({title: s.name+' — Tedarikçi Hesabı', text}).catch(()=>{}); }
    else if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>alert('Hesap özeti kopyalandı.')).catch(()=>alert(text));
    } else { alert(text); }
    return;
  }
  openShareChoiceModal('Tedarikçi Hesap Özetini Gönder', s, `sendSupplierStatementToPhone('${id}')`, `sendSupplierStatementOther('${id}')`);
}

}
function printViaCapture(fn){
  const hadShare = 'share' in navigator;
  const originalShare = hadShare ? navigator.share.bind(navigator) : null;
  let captured = null;
  navigator.share = (data)=>{ captured = data; return Promise.resolve(); };
  try{ fn(); } finally {
    if(hadShare) navigator.share = originalShare; else delete navigator.share;
  }
  if(captured) printStatementText(captured.title, captured.text);
  else alert('Yazdırılacak içerik oluşturulamadı.');
}

// ---------- çalışanlar ----------
function employeeMovementsOf(id){
  return state.employeeMovements.filter(m=>m.employeeId===id).sort((a,b)=> new Date(a.date)-new Date(b.date) || a.id.localeCompare(b.id));
}
function monthsElapsedSince(startDate){
  const start = new Date(startDate); const now = new Date(today());
  let months = (now.getFullYear()-start.getFullYear())*12 + (now.getMonth()-start.getMonth()) + 1;
  return Math.max(0, months);
}
function employeeAutoAccrued(e){
  if(!e || !e.monthlySalary) return 0;
  return monthsElapsedSince(e.startDate) * e.monthlySalary;

function employeeAttendanceDeduction(e){
  if(!e || !e.monthlySalary) return 0;
  const daily = round2(e.monthlySalary/30);

function employeeBalance(id){
  const e = state.employees.find(x=>x.id===id);
  const auto = employeeAutoAccrued(e);
  const manualHakedis = employeeManualHakedis(id);
  const odendi = employeeTotalPaid(id);

}

  if(!rows.length){ lines.push('Henüz hareket yok.'); }
  else {
    rows.forEach(m=>{
      const prevRunning = running;
      running += m.type==='borc' ? m.amount : -m.amount;
      const label = m.type==='borc' ? (m.desc||'Hakediş') : (m.desc||'Ödeme');

// ---------- voice parsing ----------
const ONES = {sıfır:0,bir:1,iki:2,üç:3,dört:4,beş:5,altı:6,yedi:7,sekiz:8,dokuz:9};
const TENS = {on:10,yirmi:20,otuz:30,kırk:40,elli:50,altmış:60,yetmiş:70,seksen:80,doksan:90};
const FILLER = new Set(['artı','eşittir','kdv','ve','lira','liradan','tl','tane','adet']);
function isNumberWord(tok){ return ONES.hasOwnProperty(tok) || TENS.hasOwnProperty(tok) || tok==='yüz' || tok==='bin' || /^\d+([.,]\d+)?$/.test(tok); }
function wordsToNumber(tokens){
  let total=0, current=0;
  for(const tok of tokens){
    if(tok==='yüz'){ current = (current===0?1:current)*100; }
    else if(tok==='bin'){ total += (current===0?1:current)*1000; current=0; }
    else if(TENS.hasOwnProperty(tok)) current += TENS[tok];
    else if(ONES.hasOwnProperty(tok)) current += ONES[tok];
    else if(/^\d+([.,]\d+)?$/.test(tok)) current += parseFloat(tok.replace(',','.'));
  }
  return total+current;
}
function tokenizeGrouped(text){
  const rawTokens = text.toLowerCase().replace(/[.,](?!\d)/g,'').split(/\s+/).filter(Boolean);
  const grouped = []; let buf = [];
  function flush(){ if(buf.length){ grouped.push({num: wordsToNumber(buf)}); buf=[]; } }
  for(const tok of rawTokens){ if(isNumberWord(tok)) buf.push(tok); else { flush(); grouped.push({word:tok}); } }
  flush(); return grouped;
}
function parseItemFromGrouped(grouped){
  let qty=null, price=null;
  for(let i=0;i<grouped.length;i++){ if(grouped[i].num!==undefined && grouped[i+1] && (grouped[i+1].word==='tane' || grouped[i+1].word==='adet')){ qty = grouped[i].num; grouped[i]._used='qty'; grouped[i+1]._used='qty'; break; } }
  for(let i=grouped.length-1;i>=0;i--){ if(grouped[i].num!==undefined && grouped[i+1] && ['lira','liradan','tl'].includes(grouped[i+1].word)){ price = grouped[i].num; grouped[i]._used='price'; grouped[i+1]._used='price'; break; } }
  if(price===null){ for(let i=grouped.length-1;i>=0;i--){ if(grouped[i].num!==undefined && !grouped[i]._used){ price=grouped[i].num; grouped[i]._used='price'; break; } } }
  const nameParts = grouped.filter(g=> !g._used && g.word && !FILLER.has(g.word)).map(g=>g.word);
  return { qty: qty||1, price: price||0, productName: nameParts.join(' ').trim() };
}
function parseVoiceLine(text){ return parseItemFromGrouped(tokenizeGrouped(text)); }
function parseFullDeliveryVoice(text){
  const grouped = tokenizeGrouped(text);
  let qtyIdx=-1;
  for(let i=0;i<grouped.length;i++){ if(grouped[i].num!==undefined && grouped[i+1] && (grouped[i+1].word==='tane' || grouped[i+1].word==='adet')){ qtyIdx=i; break; } }
  let customerName=''; let itemGrouped = grouped;
  if(qtyIdx>=0){ customerName = grouped.slice(0,qtyIdx).filter(g=>g.word && !FILLER.has(g.word)).map(g=>g.word).join(' '); itemGrouped = grouped.slice(qtyIdx); }
  const item = parseItemFromGrouped(itemGrouped);
  return { customerName: customerName.trim(), ...item };
}
function parseFullDeliveryVoiceMulti(text){
  const grouped = tokenizeGrouped(text);
  const qtyMarkers = [];
  for(let i=0;i<grouped.length;i++){ if(grouped[i].num!==undefined && grouped[i+1] && (grouped[i+1].word==='tane' || grouped[i+1].word==='adet')){ qtyMarkers.push(i); } }
  let customerName=''; let items=[];
  if(!qtyMarkers.length){ return { customerName:'', items:[] }; }
  customerName = grouped.slice(0,qtyMarkers[0]).filter(g=>g.word && !FILLER.has(g.word)).map(g=>g.word).join(' ');
  for(let m=0;m<qtyMarkers.length;m++){
    const start = qtyMarkers[m];
    const end = m+1<qtyMarkers.length ? qtyMarkers[m+1] : grouped.length;
    const chunk = grouped.slice(start, end).map(g=>({...g}));
    items.push(parseItemFromGrouped(chunk));
  }
  return { customerName: customerName.trim(), items };
}
function matchProductByName(name){
  if(!name) return null;
  const n = name.toLowerCase();
  return state.products.find(p => { const pn=p.name.toLowerCase(); return pn===n || pn.includes(n) || n.includes(pn); }) || null;
}
let activeRecognitions = {};
function startVoiceGeneric(SR, onText, btnId){
  const btn = btnId ? document.getElementById(btnId) : null;
  const statusEl = btnId ? document.getElementById(btnId+'-status') : null;
  if(activeRecognitions[btnId]){
    try{ activeRecognitions[btnId].abort(); }catch(e){}
    delete activeRecognitions[btnId];
    if(btn) btn.classList.remove('listening');
    if(statusEl) statusEl.textContent='';
    return;
  }
  const rec = new SR();
  rec.lang = 'tr-TR'; rec.continuous = false; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onstart = ()=>{ if(btn) btn.classList.add('listening'); if(statusEl) statusEl.textContent='🔴 Dinleniyor… konuşun'; };
  rec.onresult = (e)=>{
    const text = e.results[0][0].transcript.trim();
    if(statusEl) statusEl.textContent = text ? '✅ Alındı' : '';
    if(text) onText(text);
  };
  rec.onerror = ()=>{ if(statusEl) statusEl.textContent='Anlaşılamadı, tekrar deneyin.'; };
  rec.onend = ()=>{ if(btn) btn.classList.remove('listening'); delete activeRecognitions[btnId]; };
  activeRecognitions[btnId] = rec;
  rec.start();
}
function startVoice(rowId){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('Bu tarayıcı sesli komutu desteklemiyor. Chrome (Android) kullanmayı deneyin.'); return; }
  startVoiceGeneric(SR, (text)=>{
    const parsed = parseVoiceLine(text);
    const qtyEl = document.getElementById('qty-'+rowId);
    const nameEl = document.getElementById('name-'+rowId);
    const priceEl = document.getElementById('price-'+rowId);
    if(qtyEl) qtyEl.value = parsed.qty;
    if(nameEl) nameEl.value = parsed.productName || nameEl.value;
    if(priceEl) priceEl.value = parsed.price;
    recalcLine(rowId);
  }, 'mic-'+rowId);
}

function turkishNormalize(s){
  return (s||'').replace(/İ/g,'i').replace(/I/g,'ı').toLowerCase()
    .replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ı/g,'i');
}
const GENERIC_NAME_WORDS = new Set(['petshop','pet','shop','bey','hanim','hanım','cadde','sokak','mahalle','mahallesi','market','magaza','mağaza','ticaret','isletme','işletme','firma','firması','ve','ile','the'].map(w=>turkishNormalize(w)));
function levenshteinDist(a,b){
  const m=a.length, n=b.length;
  if(!m) return n; if(!n) return m;
  let prev = Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){
      cur[j] = a[i-1]===b[j-1] ? prev[j-1] : 1+Math.min(prev[j-1],prev[j],cur[j-1]);
    }
    prev=cur;
  }
  return prev[n];
}
function voiceFuzzyCorrect(heardText, candidateNames){
  const norm = turkishNormalize(heardText.trim());
  if(!norm || !candidateNames.length) return heardText;
  let best=null, bestScore=-1;
  candidateNames.forEach(name=>{
    const n = turkishNormalize(name);
    if(!n) return;
    const dist = levenshteinDist(norm, n);
    const score = 1 - dist/Math.max(norm.length, n.length, 1);
    if(score>bestScore){ bestScore=score; best=name; }
  });
  return (bestScore>=0.55) ? best : heardText;
}
function voiceWordQuery(heardText, itemStrings){
  const words = turkishNormalize(heardText).split(/\s+/).filter(w=>w.length>=3 && !GENERIC_NAME_WORDS.has(w));
  words.sort((a,b)=>b.length-a.length);
  for(const w of words){ if(itemStrings.some(s=>s.includes(w))) return w; }
  return null;
}

  if(c.includes('cikolata')) return '🍫';
  if(c.includes('gofret')) return '🧇';
  if(c.includes('kraker')) return '🥨';
  if(c.includes('kum')) return '🐾';
  if(c.includes('mama')) return '🍽️';

  if(c.includes('cikolata')) return 'var(--rust)';
  if(c.includes('gofret')) return 'var(--blue)';
  if(c.includes('kraker')) return '#7A8B4A';
  if(c.includes('kum')) return 'var(--teal)';
  if(c.includes('mama')) return 'var(--navy)';
  return 'var(--teal)';
}
const BRAND_COLORS = ['var(--brass)', 'var(--rust)', 'var(--teal)', 'var(--blue)', '#7A8B4A', '#C2698D', 'var(--navy)'];
function brandColor(brand){
  let hash = 0;
  const s = brand || '';
  for(let i=0;i<s.length;i++){ hash = (hash*31 + s.charCodeAt(i)) % 997; }
  return BRAND_COLORS[Math.abs(hash) % BRAND_COLORS.length];
}
