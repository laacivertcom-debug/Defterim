  .stat{padding:16px; display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:12px;}

  .line-total{text-align:right; font-size:13px; color:var(--navy); font-weight:600;}

  .voice-cta{padding:18px; text-align:center; margin-bottom:18px; border:2px dashed var(--brass);}

  .kv-hint{font-size:12px; color:var(--muted); margin-top:4px;}
  .overdue-tag{font-size:11px; color:var(--rust); font-weight:700; margin-top:2px;}
  .date-strong{color:var(--navy); font-weight:700; font-size:13.5px;}
  .reminder-row{display:flex; justify-content:space-between; align-items:center; padding:11px 16px; border-bottom:1.5px solid var(--linefaint); cursor:pointer;}
  .reminder-row:last-child{border-bottom:none;}

  .badge-days{font-size:11px; font-weight:700; padding:4px 10px; border-radius:99px; color:#fff; white-space:nowrap;}

</style>

const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{const r=Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16);});
function isValidUUID(str){ return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(str||''); }
function migrateCustomerIdsToUUID(){
  let changed = false;
  state.customers.forEach(c=>{
    if(!isValidUUID(c.id)){
      const oldId = c.id; const newId = uid(); c.id = newId; changed = true;
      state.movements.forEach(m=>{ if(m.customerId===oldId) m.customerId=newId; });
    }
  });
  if(changed) persist();
}
const tl = n => (Number(n)||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
const round2 = n => Math.round((Number(n)||0)*100)/100;
function parseAmount(raw){
  if(raw==null) return 0;
  let s = String(raw).trim();
  if(s==='') return 0;
  const hasComma = s.includes(',');
  if(hasComma){
    s = s.replace(/\./g,'').replace(',', '.');
  } else {
    const dotCount = (s.match(/\./g)||[]).length;
    if(dotCount>=2){
      const lastIdx = s.lastIndexOf('.');
      const intPart = s.slice(0,lastIdx).replace(/\./g,'');
      const decPart = s.slice(lastIdx+1);
      s = intPart + '.' + decPart;
    } else if(dotCount===1){
      const parts = s.split('.');
      if(parts[1].length===3){ s = parts.join(''); }
    }
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => new Date(d).toLocaleDateString('tr-TR',{day:'2-digit',month:'short',year:'numeric'});
const VAT_DEFAULT = 20;
function addMonths(dateStr, n){ const d = new Date(dateStr||today()); d.setMonth(d.getMonth()+n); return d.toISOString().slice(0,10); }

const STORE_KEY = 'defterim_data_v3';
function loadState(){
  let s = null;
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw) s = JSON.parse(raw); }catch(e){}
  if(!s){ try{ const old = localStorage.getItem('defterim_data_v2'); if(old) s = JSON.parse(old); }catch(e){} }
  if(!s) s = {customers:[], products:[], movements:[], ledger:[], freeNotes:[]};
  s.freeNotes = s.freeNotes || [];
  s.pin = s.pin || null;
  s.trash = (s.trash||[]).filter(t=> (new Date(today())-new Date(t.deletedAt))/86400000 <= 30);
  s.suppliers = s.suppliers || [];
  s.bankLoans = s.bankLoans || [];
  s.bankLoanMovements = s.bankLoanMovements || [];
  s.supplierMovements = s.supplierMovements || [];
  s.employees = (s.employees || []).map(e=>({ ...e, monthlySalary: e.monthlySalary||0, attendance: e.attendance||{} }));
  s.employeeMovements = s.employeeMovements || [];
  s.customers = (s.customers||[]).map(c=>({ id:c.id, name:c.name, phone:c.phone, note:c.note||'', image:c.image||null, address:c.address||'', tckn:c.tckn||'', taxId:c.taxId||'', taxOffice:c.taxOffice||'', pendingItems:(c.pendingItems||[]).map(i=>({id:i.id, name:i.name, qty:i.qty, unit:i.unit||'adet', delivered:i.delivered||false, deliveredDate:i.deliveredDate||null})), locationQuery:c.locationQuery||'', location:c.location||null, customerNo:c.customerNo||null, invoiceFree:c.invoiceFree||false, signCode:c.signCode||null }));
  { let maxNo = 0;
    s.customers.forEach(c=>{ if(c.customerNo) maxNo = Math.max(maxNo, c.customerNo); });
    s.customers.forEach(c=>{ if(!c.customerNo){ maxNo += 1; c.customerNo = maxNo; } });
    s.customerCounter = Math.max(s.customerCounter||0, maxNo);
  }
  s.ledger = (s.ledger||[]).map(l=>({
    id:l.id, date:l.date, type:l.type, category:l.category||'Genel', desc:l.desc,
    baseAmount: l.baseAmount!=null? l.baseAmount : l.amount, kdvOn: l.kdvOn||false, kdvPct: l.kdvPct||VAT_DEFAULT,
    amount: l.amount
  }));
  s.deliveryNotes = s.deliveryNotes || [];
  return s;
}

      <div class="modal-body">

function trashAdd(type, payload){
  state.trash.unshift({id:uid(), type, deletedAt:today(), payload});
  persist();
}
function permanentDeleteTrash(trashId){
  requirePin(()=>{ state.trash = state.trash.filter(x=>x.id!==trashId); persist(); render(); });
}
function restoreTrash(trashId){
  const t = state.trash.find(x=>x.id===trashId); if(!t) return;
  if(t.type==='customer'){
    state.customers.push(t.payload.customer);
    (t.payload.movements||[]).forEach(m=>{
      state.movements.push(m);
      if(m.type==='teslim' && m.items){ m.items.forEach(it=>{ if(it.productId){ const p=state.products.find(p=>p.id===it.productId); if(p&&p.stock!=null) p.stock=Math.max(0,p.stock-it.qty); } }); }
    });
  } else if(t.type==='product'){ state.products.push(t.payload); }
  else if(t.type==='ledger'){ state.ledger.push(t.payload); }
  else if(t.type==='movement'){
    state.movements.push(t.payload);
    if(t.payload.type==='teslim' && t.payload.items){ t.payload.items.forEach(it=>{ if(it.productId){ const p=state.products.find(p=>p.id===it.productId); if(p&&p.stock!=null) p.stock=Math.max(0,p.stock-it.qty); } }); }
  }
  else if(t.type==='supplier'){
    state.suppliers.push(t.payload.supplier);
    (t.payload.movements||[]).forEach(m=> state.supplierMovements.push(m));
  }
  else if(t.type==='supplierMovement'){ state.supplierMovements.push(t.payload); }
  else if(t.type==='customerReset'){
    (t.payload.movements||[]).forEach(m=>{
      state.movements.push(m);
      if(m.type==='teslim' && m.items){ m.items.forEach(it=>{ if(it.productId){ const p=state.products.find(p=>p.id===it.productId); if(p&&p.stock!=null) p.stock=Math.max(0,p.stock-it.qty); } }); }
    });
  }
  else if(t.type==='employee'){
    state.employees.push(t.payload.employee);
    (t.payload.movements||[]).forEach(m=> state.employeeMovements.push(m));
  }
  else if(t.type==='employeeMovement'){ state.employeeMovements.push(t.payload); }
  else if(t.type==='bankLoan'){
    state.bankLoans.push(t.payload.bankLoan);
    (t.payload.movements||[]).forEach(m=> state.bankLoanMovements.push(m));
  }
  else if(t.type==='bankLoanMovement'){ state.bankLoanMovements.push(t.payload); }
  state.trash = state.trash.filter(x=>x.id!==trashId);
  persist(); render();
}
function trashLabel(t){
  if(t.type==='customer') return `Müşteri: ${t.payload.customer.name}`;
  if(t.type==='product') return `Ürün: ${t.payload.name}`;
  if(t.type==='ledger') return `${t.payload.type==='gelir'?'Gelir':'Gider'}: ${t.payload.desc} — ₺${tl(t.payload.amount)}`;
  if(t.type==='movement') return `${t.payload.type==='teslim'?'Teslimat':'Ödeme'}: ${t.payload.desc||''} — ₺${tl(t.payload.total)}`;
  if(t.type==='supplier') return `Tedarikçi: ${t.payload.supplier.name}`;
  if(t.type==='supplierMovement') return `Tedarikçi ${t.payload.type==='borc'?'Borç':'Ödeme'}: ${t.payload.desc} — ₺${tl(t.payload.amount)}`;
  if(t.type==='employee') return `Çalışan: ${t.payload.employee.name}`;
  if(t.type==='employeeMovement') return `Çalışan ${t.payload.type==='borc'?'Hakediş':(t.payload.type==='kesinti'?'Kesinti':'Ödeme')}: ${t.payload.desc} — ₺${tl(t.payload.amount)}`;

function customerMovements(id){ return state.movements.filter(m=>m.customerId===id).sort((a,b)=> new Date(a.date)-new Date(b.date) || a.id.localeCompare(b.id)); }
function customerTotals(id){
  const ms = state.movements.filter(m=>m.customerId===id);
  const totalDelivered = ms.filter(m=>m.type==='teslim').reduce((a,m)=>a+m.total,0);
  const totalPaid = ms.filter(m=>m.type==='odeme').reduce((a,m)=>a+m.total,0);
  return { totalDelivered, totalPaid, balance: totalDelivered-totalPaid };
}
function customerBalance(id){ return customerTotals(id).balance; }
function customerOverdue(id){
  const bal = customerBalance(id); if(bal<=0) return null;
  const overdue = state.movements.filter(m=>m.customerId===id && m.type==='teslim' && m.dueDate && m.dueDate < today());
  if(!overdue.length) return null;
  overdue.sort((a,b)=> a.dueDate.localeCompare(b.dueDate));
  return overdue[0].dueDate;
}
function shareCustomerStatement(id){
  const c = state.customers.find(x=>x.id===id); if(!c) return;
  const rows = customerMovements(id);
  let running = 0;
  const lines = [`${c.name} — Cari Hesap Özeti`, `Tarih: ${fmtDate(today())}`, ''];
  if(!rows.length){ lines.push('Henüz hareket yok.'); }
  else {
    rows.forEach((m, idx)=>{
      const prevRunning = running;
      running += m.type==='teslim' ? m.total : -m.total;
      if(m.type==='teslim' && m.items && m.items.length){
        lines.push(`${fmtDate(m.date)}: Teslimat${m.invoiced?' (Fatura ✓)':''}`);
        m.items.forEach(it=>{ lines.push(`   ${it.name}: ${it.qty} × ${tl(it.unitPrice)} = ${tl(it.lineTotal)}`); });
        lines.push(`   Toplam: ${tl(m.total)}`);
      } else {
        const label = m.type==='teslim' ? (m.desc||'Teslimat') : (m.desc||'Ödeme');
        lines.push(`${fmtDate(m.date)}: ${label} — ${tl(m.total)}`);
      }
      if(idx===0){ lines.push(`   = ${tl(running)}`); }
      else { lines.push(`   ${tl(prevRunning)} ${m.type==='teslim'?'+':'−'} ${tl(m.total)} = ${tl(running)}`); }
    });
  }
  const bal = customerBalance(id);
  lines.push('');
  lines.push(bal>0 ? `TOPLAM KALAN BORÇ: ${tl(bal)}` : (bal<0 ? `FAZLA ÖDEME: ${tl(Math.abs(bal))}` : 'HESAP KAPALI (borç yok)'));
  const pendingActive = (c.pendingItems||[]).filter(i=>!i.delivered);
  if(pendingActive.length){
    lines.push('');
    lines.push('TESLİM BEKLEYEN ÜRÜNLER:');
    const unitTotals = {};
    pendingActive.forEach(i=>{ lines.push(`   ${i.qty} ${i.unit} × ${i.name}`); unitTotals[i.unit] = (unitTotals[i.unit]||0) + i.qty; });
    const totalsText = Object.keys(unitTotals).map(u=>`${unitTotals[u]} ${u}`).join(', ');
    lines.push(`   Toplam: ${totalsText}`);
  }
  const deliveredToday = (c.pendingItems||[]).filter(i=>i.delivered && i.deliveredDate===today());
  if(deliveredToday.length){
    lines.push('');
    lines.push(`BUGÜN TESLİM EDİLEN (${fmtDate(today())}):`);
    const unitTotals2 = {};
    deliveredToday.forEach(i=>{ lines.push(`   ${i.qty} ${i.unit} × ${i.name}`); unitTotals2[i.unit] = (unitTotals2[i.unit]||0) + i.qty; });
    const totalsText2 = Object.keys(unitTotals2).map(u=>`${unitTotals2[u]} ${u}`).join(', ');
    lines.push(`   Toplam: ${totalsText2}`);
  }
  const text = lines.join('\n');
  if(navigator.share){ navigator.share({title: c.name+' — Cari Hesap', text}).catch(()=>{}); }
  else if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>alert('Hesap özeti kopyalandı, WhatsApp veya başka bir yere yapıştırabilirsiniz.')).catch(()=>alert(text));
  } else { alert(text); }
}

function employeeMovementsOf(id){
  return state.employeeMovements.filter(m=>m.employeeId===id).sort((a,b)=> new Date(a.date)-new Date(b.date) || a.id.localeCompare(b.id));
}
function monthsElapsedSince(startDate){
  const start = new Date(startDate); const now = new Date(today());
  let months = (now.getFullYear()-start.getFullYear())*12 + (now.getMonth()-start.getMonth()) + 1;
  return Math.max(0, months);
}
function employeeAutoAccrued(e){
  if(!e || !e.monthlySalary) return 0;
  return monthsElapsedSince(e.startDate) * e.monthlySalary;
}
function employeeManualHakedis(id){
  return state.employeeMovements.filter(m=>m.employeeId===id && m.type==='borc').reduce((a,m)=>a+m.amount,0);
}
function employeeTotalPaid(id){
  return state.employeeMovements.filter(m=>m.employeeId===id && m.type==='odeme').reduce((a,m)=>a+m.amount,0);
}
function employeeTotalDeductions(id){
  return state.employeeMovements.filter(m=>m.employeeId===id && m.type==='kesinti').reduce((a,m)=>a+m.amount,0);
}
function employeeAttendanceDeduction(e){
  if(!e || !e.monthlySalary) return 0;
  const daily = round2(e.monthlySalary/30);
  return round2(daily * employeeAbsentDaysCount(e));
}
function employeeBalance(id){
  const e = state.employees.find(x=>x.id===id);
  const auto = employeeAutoAccrued(e);
  const manualHakedis = employeeManualHakedis(id);
  const odendi = employeeTotalPaid(id);

  return auto + manualHakedis - odendi - kesinti - devamsizlik;
}

// ---------- voice parsing ----------
const ONES = {sıfır:0,bir:1,iki:2,üç:3,dört:4,beş:5,altı:6,yedi:7,sekiz:8,dokuz:9};
const TENS = {on:10,yirmi:20,otuz:30,kırk:40,elli:50,altmış:60,yetmiş:70,seksen:80,doksan:90};
const FILLER = new Set(['artı','eşittir','kdv','ve','lira','liradan','tl','tane','adet']);
function isNumberWord(tok){ return ONES.hasOwnProperty(tok) || TENS.hasOwnProperty(tok) || tok==='yüz' || tok==='bin' || /^\d+([.,]\d+)?$/.test(tok); }
function wordsToNumber(tokens){
  let total=0, current=0;
  for(const tok of tokens){
    if(tok==='yüz'){ current = (current===0?1:current)*100; }
    else if(tok==='bin'){ total += (current===0?1:current)*1000; current=0; }
    else if(TENS.hasOwnProperty(tok)) current += TENS[tok];
    else if(ONES.hasOwnProperty(tok)) current += ONES[tok];
    else if(/^\d+([.,]\d+)?$/.test(tok)) current += parseFloat(tok.replace(',','.'));
  }
  return total+current;
}
function tokenizeGrouped(text){
  const rawTokens = text.toLowerCase().replace(/[.,](?!\d)/g,'').split(/\s+/).filter(Boolean);
  const grouped = []; let buf = [];
  function flush(){ if(buf.length){ grouped.push({num: wordsToNumber(buf)}); buf=[]; } }
  for(const tok of rawTokens){ if(isNumberWord(tok)) buf.push(tok); else { flush(); grouped.push({word:tok}); } }
  flush(); return grouped;
}
function parseItemFromGrouped(grouped){
  let qty=null, price=null;
  for(let i=0;i<grouped.length;i++){ if(grouped[i].num!==undefined && grouped[i+1] && (grouped[i+1].word==='tane' || grouped[i+1].word==='adet')){ qty = grouped[i].num; grouped[i]._used='qty'; grouped[i+1]._used='qty'; break; } }
  for(let i=grouped.length-1;i>=0;i--){ if(grouped[i].num!==undefined && grouped[i+1] && ['lira','liradan','tl'].includes(grouped[i+1].word)){ price = grouped[i].num; grouped[i]._used='price'; grouped[i+1]._used='price'; break; } }
  if(price===null){ for(let i=grouped.length-1;i>=0;i--){ if(grouped[i].num!==undefined && !grouped[i]._used){ price=grouped[i].num; grouped[i]._used='price'; break; } } }
  const nameParts = grouped.filter(g=> !g._used && g.word && !FILLER.has(g.word)).map(g=>g.word);
  return { qty: qty||1, price: price||0, productName: nameParts.join(' ').trim() };
}
function parseVoiceLine(text){ return parseItemFromGrouped(tokenizeGrouped(text)); }
function parseFullDeliveryVoice(text){
  const grouped = tokenizeGrouped(text);
  let qtyIdx=-1;
  for(let i=0;i<grouped.length;i++){ if(grouped[i].num!==undefined && grouped[i+1] && (grouped[i+1].word==='tane' || grouped[i+1].word==='adet')){ qtyIdx=i; break; } }
  let customerName=''; let itemGrouped = grouped;
  if(qtyIdx>=0){ customerName = grouped.slice(0,qtyIdx).filter(g=>g.word && !FILLER.has(g.word)).map(g=>g.word).join(' '); itemGrouped = grouped.slice(qtyIdx); }
  const item = parseItemFromGrouped(itemGrouped);
  return { customerName: customerName.trim(), ...item };
}
function parseFullDeliveryVoiceMulti(text){
  const grouped = tokenizeGrouped(text);
  const qtyMarkers = [];
  for(let i=0;i<grouped.length;i++){ if(grouped[i].num!==undefined && grouped[i+1] && (grouped[i+1].word==='tane' || grouped[i+1].word==='adet')){ qtyMarkers.push(i); } }
  let customerName=''; let items=[];
  if(!qtyMarkers.length){ return { customerName:'', items:[] }; }
  customerName = grouped.slice(0,qtyMarkers[0]).filter(g=>g.word && !FILLER.has(g.word)).map(g=>g.word).join(' ');
  for(let m=0;m<qtyMarkers.length;m++){
    const start = qtyMarkers[m];
    const end = m+1<qtyMarkers.length ? qtyMarkers[m+1] : grouped.length;
    const chunk = grouped.slice(start, end).map(g=>({...g}));
    items.push(parseItemFromGrouped(chunk));
  }
  return { customerName: customerName.trim(), items };
}
function matchProductByName(name){
  if(!name) return null;
  const n = name.toLowerCase();
  return state.products.find(p => { const pn=p.name.toLowerCase(); return pn===n || pn.includes(n) || n.includes(pn); }) || null;
}
let activeRecognitions = {};
function startVoiceGeneric(SR, onText, btnId){
  const btn = btnId ? document.getElementById(btnId) : null;
  const statusEl = btnId ? document.getElementById(btnId+'-status') : null;
  if(activeRecognitions[btnId]){
    try{ activeRecognitions[btnId].abort(); }catch(e){}
    delete activeRecognitions[btnId];
    if(btn) btn.classList.remove('listening');
    if(statusEl) statusEl.textContent='';
    return;
  }
  const rec = new SR();
  rec.lang = 'tr-TR'; rec.continuous = false; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onstart = ()=>{ if(btn) btn.classList.add('listening'); if(statusEl) statusEl.textContent='🔴 Dinleniyor… konuşun'; };
  rec.onresult = (e)=>{
    const text = e.results[0][0].transcript.trim();
    if(statusEl) statusEl.textContent = text ? '✅ Alındı' : '';
    if(text) onText(text);
  };
  rec.onerror = ()=>{ if(statusEl) statusEl.textContent='Anlaşılamadı, tekrar deneyin.'; };
  rec.onend = ()=>{ if(btn) btn.classList.remove('listening'); delete activeRecognitions[btnId]; };
  activeRecognitions[btnId] = rec;
  rec.start();
}
function startVoice(rowId){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('Bu tarayıcı sesli komutu desteklemiyor. Chrome (Android) kullanmayı deneyin.'); return; }
  startVoiceGeneric(SR, (text)=>{
    const parsed = parseVoiceLine(text);
    const qtyEl = document.getElementById('qty-'+rowId);
    const nameEl = document.getElementById('name-'+rowId);

function initSignCanvas(){
  const canvas = document.getElementById('sign-canvas'); if(!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.strokeStyle = '#0B2027';
  let drawing = false, lastX=0, lastY=0;
  function pos(e){ const r = canvas.getBoundingClientRect(); return { x:(e.clientX-r.left)*(canvas.width/r.width), y:(e.clientY-r.top)*(canvas.height/r.height) }; }
  function start(e){ drawing=true; canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId); const p=pos(e); lastX=p.x; lastY=p.y; e.preventDefault(); }
  function move(e){ if(!drawing) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke(); lastX=p.x; lastY=p.y; e.preventDefault(); }
  function end(e){ drawing=false; }
  canvas.addEventListener('pointerdown', start);
  canvas.addEventListener('pointermove', move);
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('pointerleave', end);
}
function clearSignCanvas(){ const canvas = document.getElementById('sign-canvas'); if(!canvas) return; canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height); }
function confirmSignDeliveryNote(movementId, customerId, needsCodeSetup){

    if(entered !== c.signCode){ alert('❌ Kod yanlış. Lütfen müşterinin kodunu doğru girin.'); return; }
  }
  const canvas = document.getElementById('sign-canvas');
  const ctx = canvas.getContext('2d');
  const blank = document.createElement('canvas'); blank.width=canvas.width; blank.height=canvas.height;
  if(canvas.toDataURL() === blank.toDataURL()){ alert('Lütfen imza alanına imzalayın.'); return; }
  const signatureData = canvas.toDataURL('image/png');
  const note = { id:uid(), customerId, movementId, date:today(), items:m.items||[], total:m.total||0, signatureData, signed:true };

  // müşteri kaydı buluttan eksik olduğu için foreign key hatası alınmasın.
  if(state.customers.length>0){
    const custRows = state.customers.map(jsCustomerToRow);
    const { error: custErr } = await sb.from('musteriler').upsert(custRows);
    if(custErr){ alert('❌ Müşteriler ön-senkronizasyonu başarısız: ' + custErr.message); return; }
  }
  const customerIds = new Set(state.customers.map(c=>c.id));
  const valid = state.movements.filter(m=>customerIds.has(m.customerId));
  const invalid = state.movements.filter(m=>!customerIds.has(m.customerId));
  if(valid.length===0){ alert('❌ Yüklenecek geçerli hareket bulunamadı. Tüm hareketler artık mevcut olmayan müşterilere ait görünüyor.'); return; }
  const rows = valid.map(jsMovementToRow);
  const { error } = await sb.from('hareketler').upsert(rows);
  if(error){ alert('❌ Yükleme başarısız: ' + error.message); }
  else{
    let msg = `✅ ${rows.length} hareket buluta yüklendi.`;
    if(invalid.length>0){
      msg += `\n\n⚠️ ${invalid.length} hareket atlandı (artık mevcut olmayan bir müşteriye ait): \n`;
      invalid.slice(0,10).forEach(m=>{ msg += `- ${m.type||'?'} / ${m.date||'?'} / ${m.total!=null?tl(m.total):'?'} TL (müşteri ID: ${m.customerId})\n`; });
      if(invalid.length>10) msg += `...ve ${invalid.length-10} tane daha.`;
    }
    alert(msg);
  }
}
function findDuplicateCustomer(name, phone){
  const nameLower = (name||'').trim().toLowerCase();
  const phoneNorm = (phone||'').replace(/\s+/g,'');
  const exact = state.customers.find(c => (c.name||'').trim().toLowerCase()===nameLower || (phoneNorm && c.phone && c.phone.replace(/\s+/g,'')===phoneNorm));
  if(exact) return exact;
  const newWords = turkishNormalize(name).split(/\s+/).filter(w=>w.length>=3 && !GENERIC_NAME_WORDS.has(w));
  if(newWords.length < 2) return null;
  return state.customers.find(c=>{
    const existingWords = turkishNormalize(c.name).split(/\s+/).filter(w=>w.length>=3 && !GENERIC_NAME_WORDS.has(w));
    const common = newWords.filter(w=>existingWords.includes(w));
    return common.length >= 2;
  }) || null;
}

function resizeImageFile(file, maxDim, quality, callback){
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        if(w > h){ h = Math.round(h*maxDim/w); w = maxDim; } else { w = Math.round(w*maxDim/h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      try{ callback(canvas.toDataURL('image/jpeg', quality)); }
      catch(err){ callback(e.target.result); }
    };
    img.onerror = ()=>{ callback(e.target.result); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

      state.movements.push(om);
      sbUpsertMovement(om);
    }
    savedCustomer = c;
  }
  editingCustomerId = null; pendingCustomerImage = null;

function recalcLedgerVat(){

function submitLedger(){

  const desc = document.getElementById('f-desc').value.trim();

    const l = state.ledger.find(x=>x.id===editingLedgerId);
    if(l){ l.type=ledgerType; l.category=category; l.desc=desc; l.baseAmount=base; l.kdvOn=kdvOn; l.kdvPct=kdvPct; l.amount=amount; sbUpsertLedger(l); }

function recalcLine(id){
  const l = deliveryLines.find(x=>x.id===id); if(!l) return;
  l.name = document.getElementById('name-'+id)?.value ?? l.name;
  l.qty = Number(document.getElementById('qty-'+id)?.value || 0);
  l.price = parseAmount(document.getElementById('price-'+id)?.value || 0);
  l.kdvOn = document.getElementById('kdv-'+id)?.checked ?? l.kdvOn;
  l.kdvPct = Number(document.getElementById('kdvpct-'+id)?.value || 0);
  const finalUnit = round2(l.kdvOn ? l.price*(1+l.kdvPct/100) : l.price);
  const lineTotal = round2(l.qty*finalUnit);
  const totalEl = document.getElementById('total-'+id);
  if(totalEl) totalEl.innerHTML = l.qty && l.price ? `${l.qty} × ₺${tl(finalUnit)} = <strong>₺${tl(lineTotal)}</strong>${finalUnit>5000?` <span style="color:var(--rust);font-weight:700;">⚠️ Fiyat çok yüksek görünüyor, kontrol edin</span>`:''}` : '';
  const grand = deliveryLines.reduce((a,x)=>{ const fu = round2(x.kdvOn ? x.price*(1+x.kdvPct/100) : x.price); return a + round2(x.qty*fu); },0);
  const grandEl = document.getElementById('grand-total');
  if(grandEl) grandEl.textContent = '₺'+tl(grand);
}
let pendingDeliveryEdit = null;
function submitDelivery(customerId){
  const date = document.getElementById('f-date').value || today();
  const dueDate = document.getElementById('f-duedate').value || null;
  const paidAmount = parseAmount(document.getElementById('f-paidamount')?.value || 0);
  const invoiced = document.getElementById('f-invoiced').checked;
  const items = deliveryLines.filter(l=>l.qty>0 && l.price>=0 && l.name.trim()).map(l=>{
    const finalUnit = round2(l.kdvOn ? l.price*(1+l.kdvPct/100) : l.price);
    return { productId: l.productId||null, name: l.name.trim(), qty:l.qty, unitPrice:finalUnit, lineTotal: round2(l.qty*finalUnit) };
  });
  if(!items.length) return;
  const total = items.reduce((a,i)=>a+i.lineTotal,0);
  const desc = items.map(i=>`${i.qty}x ${i.name}`).join(', ');
  if(editingMovementId){
    const m = state.movements.find(x=>x.id===editingMovementId);
    if(!m) return;
    captureDeliveryDraftMeta();
    pendingDeliveryEdit = { customerId, movementId: editingMovementId, date, dueDate, invoiced, items, total, desc, paidAmount };
    requirePin(()=>{ openDeliveryEditConfirm(m, pendingDeliveryEdit); });
    return;
  } else {
    items.forEach(it=>{ if(it.productId){ const p=state.products.find(p=>p.id===it.productId); if(p&&p.stock!=null) p.stock=Math.max(0,p.stock-it.qty); } });
    const newM = {id:uid(), customerId, date, dueDate, invoiced, type:'teslim', items, total, desc};
    state.movements.push(newM);
    sbUpsertMovement(newM);
    if(paidAmount>0){ const payM = {id:uid(), customerId, date, type:'odeme', total:paidAmount, desc:'Teslimatla birlikte alınan ödeme'}; state.movements.push(payM); sbUpsertMovement(payM); }
  }

}

    d.items.forEach(it=>{ if(it.productId){ const p=state.products.find(p=>p.id===it.productId); if(p&&p.stock!=null) p.stock=Math.max(0,p.stock-it.qty); } });
    m.date=d.date; m.dueDate=d.dueDate; m.invoiced=d.invoiced; m.items=d.items; m.total=d.total; m.desc=d.desc;

    data.freeNotes = data.freeNotes || []; data.ledger = data.ledger || []; data.suppliers = data.suppliers || []; data.supplierMovements = data.supplierMovements || []; data.pin = data.pin || null; data.trash = data.trash || [];

  }catch(e){ err.textContent='Metin okunamadı. Doğru yedek metnini yapıştırdığınızdan emin olun.'; }
}
function restoreBackupFile(input){
  const file = input.files && input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!data.customers || !data.movements){ alert('Bu dosya geçerli bir Defterim yedeği gibi görünmüyor.'); return; }
      if(!confirm('Mevcut verilerin üzerine yazılacak, emin misiniz?')) return;
      data.freeNotes = data.freeNotes || []; data.ledger = data.ledger || []; data.suppliers = data.suppliers || []; data.supplierMovements = data.supplierMovements || []; data.pin = data.pin || null; data.trash = data.trash || [];
      state = data; persist(); render();
      alert('Yedek başarıyla geri yüklendi.');
    }catch(err){ alert('Dosya okunamadı. Geçerli bir yedek dosyası seçtiğinizden emin olun.'); }
    input.value = '';
  };
  reader.readAsText(file);
}

  const manualExpense = state.ledger.filter(l=>l.type==='gider').reduce((a,l)=>a+l.amount,0);
  const totalReceivable = state.customers.reduce((a,c)=>{ const b=customerBalance(c.id); return a + (b>0?b:0); },0);

      <button class="btn" onclick="modalSupplierMovement('${s.id}','odeme')">${ICONS.plus} Ödeme Yaptım</button>
    </div>`;
    const rows = supplierMovementsOf(s.id);
    let running = 0;
    const withRunning = rows.map(m=>{ running += m.type==='borc' ? m.amount : -m.amount; return {...m, running}; });
    if(withRunning.length===0){ html += `<div class="card"><div class="empty">Henüz hareket yok.</div></div>`; }
    else {
      withRunning.slice().reverse().forEach(m=>{
        const isBorc = m.type==='borc';
        html += `<div class="card" style="padding:14px 16px;margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;">
            <div class="date-strong">${fmtDate(m.date)}</div>
            <div style="text-align:right;"><div class="mono" style="font-size:17px;font-weight:700;color:${isBorc?'var(--rust)':'var(--green)'};">${isBorc?'+':'−'}₺${tl(m.amount)}</div><div class="muted" style="font-size:11px;">Bakiye: ₺${tl(m.running)}</div></div>
          </div>
          <div style="font-size:14px;margin-bottom:8px;">${m.desc}</div>
          <div style="display:flex;gap:8px;justify-content:flex-end;border-top:1.5px solid var(--linefaint);padding-top:8px;">
            <button class="btn ghost" style="padding:8px 14px;font-size:13px;" onclick="editSupplierMovement('${m.id}','${s.id}')">${ICONS.edit} Düzenle</button>
            <button class="btn ghost" style="padding:8px 14px;font-size:13px;color:var(--rust);border-color:var(--rust);" onclick="removeSupplierMovement('${m.id}')">${ICONS.trash} Sil</button>
          </div>
        </div>`;
      });
    }
  }

  else if(view==='employees'){
    html += `<div class="fab-row" style="justify-content:space-between;"><button class="btn" style="background:var(--teal);" onclick="setView('accounts')">‹‹ Hesaplar</button><span></span></div>`;
    html += `<h1 class="page">Çalışanlar</h1><p class="muted" style="margin-top:-2px;margin-bottom:14px;">Maaş/hakediş ve ödemeleri takip edin.</p>`;
    html += `<div class="fab-row"><button class="btn" onclick="modalEmployee()">${ICONS.plus} Çalışan Ekle</button></div>`;
    html += `<button class="btn ghost btn-full" style="margin-bottom:18px;" onclick="uploadAllEmployeesToCloud()">☁️ Buluta Yükle</button>`;
    if(state.employees.length===0){ html += `<div class="card"><div class="empty">Henüz çalışan eklenmedi.</div></div>`; }
    else {
      state.employees.forEach(e=>{
        const bal = employeeBalance(e.id);
        const balColor = bal>0 ? 'var(--rust)' : (bal<0 ? 'var(--green)' : 'var(--muted)');
        const balLabel = bal>0 ? 'kalan ödeme' : (bal<0 ? 'fazla ödemişiz' : 'hesap kapalı');
        const empMoveCount = state.employeeMovements.filter(m=>m.employeeId===e.id).length;
        html += `<div class="row clickable" style="border-left:5px solid var(--teal);padding:14px 16px 14px 12px;background:rgba(47,111,107,.06);border-radius:6px;border-top:1.5px solid var(--line);border-right:1.5px solid var(--line);border-bottom:1.5px solid var(--line);margin-bottom:10px;" onclick="openEmployee('${e.id}')">
          <div style="display:flex;align-items:center;gap:8px;"><span style="font-size:17px;">👤</span><div><div><strong>${e.name}</strong></div><div class="muted" style="font-size:11.5px;">${e.phone?telLink(e.phone):''} · İşe başlama: ${fmtDate(e.startDate)}${empMoveCount?` · ${empMoveCount} hareket`:''}</div></div></div>
          <div style="text-align:right;"><div class="mono" style="color:${balColor};font-weight:700;">₺${tl(Math.abs(bal))}</div><div class="muted" style="font-size:10.5px;">${balLabel}</div></div>
        </div>`;
      });
    }
  }

  else if(view==='employeeDetail'){
    const e = state.employees.find(x=>x.id===selectedEmployeeId);
    if(!e){ view='employees'; return render(); }
    const autoAccrued = employeeAutoAccrued(e);
    const manualHakedis = employeeManualHakedis(e.id);
    const totalPaid = employeeTotalPaid(e.id);
    const bal = employeeBalance(e.id);
    const balLabel = bal>0 ? 'Kalan Alacağı' : (bal<0 ? 'Fazla Ödenen' : 'Hesap Kapalı');
    html += `<div class="fab-row"><button class="btn ghost" onclick="modalEmployee('${e.id}')">${ICONS.edit} Çalışanı Düzenle</button><button class="btn blue" onclick="shareEmployeeStatement('${e.id}')">📤 Hesap Özetini Gönder</button></div>`;
    html += `<div class="card" style="padding:9px 14px;margin-bottom:10px;border-left:5px solid var(--blue);"><div style="font-size:11px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;">İşe Başlama Tarihi</div><div style="font-size:14px;font-weight:700;color:var(--navy);">${fmtDate(e.startDate)}${e.monthlySalary?` <span class="muted" style="font-size:12px;font-weight:500;">· Aylık Maaş: <span style="color:var(--navy);font-weight:700;">₺${tl(e.monthlySalary)}</span></span>`:''}</div></div>`;
    if(e.monthlySalary){
      html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px;">${heroStat('Otomatik Aylık Hakediş', autoAccrued, 'blue')}${heroStat('Net Alınan İkramiye / Mesai', manualHakedis, 'blue')}</div>`;
      html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:18px;">${heroStat('Toplam Ödenen', totalPaid, 'teal')}${heroStat(balLabel, Math.abs(bal), bal>0?'bordo':'bordo')}</div>`;
    } else if(manualHakedis>0){
      html += `<div class="grid3">${statCard(balLabel, Math.abs(bal), 'wallet', bal>0?'bordo':'bordo')}</div>`;
    } else {
      html += `<div class="grid3">${statCard('Toplam Ödenen', totalPaid, 'wallet', 'blue')}</div>`;
    }
    html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:18px;">
      <button class="btn dark btn-compact" style="margin:0;" onclick="modalEmployeeMovement('${e.id}','borc')">${ICONS.plus} ${e.monthlySalary?'Ek Hakediş / Mesai Ekle':'Hakediş / Maaş Ekle'}</button>
      <button class="btn btn-compact" style="margin:0;" onclick="modalEmployeeMovement('${e.id}','odeme')">${ICONS.plus} Ödeme Yaptım</button>
    </div>`;
    html += renderAttendanceCalendar(e);
    const rows = employeeMovementsOf(e.id);
    let erunning = 0;
    const eWithRunning = rows.map(m=>{ erunning += m.type==='borc' ? m.amount : -m.amount; return {...m, running:erunning}; });
    if(eWithRunning.length===0){ html += `<div class="card"><div class="empty">Henüz hareket yok.</div></div>`; }
    else {
      eWithRunning.slice().reverse().forEach(m=>{
        const isBorc = m.type==='borc';
        const isKesinti = m.type==='kesinti';
        const amtColor = (isBorc||isKesinti) ? 'var(--rust)' : 'var(--green)';
        html += `<div class="card" style="padding:14px 16px;margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;">
            <div class="date-strong">${fmtDate(m.date)}</div>
            <div style="text-align:right;"><div class="mono" style="font-size:17px;font-weight:700;color:${amtColor};">${isBorc?'+':'−'}₺${tl(m.amount)}</div><div class="muted" style="font-size:11px;">Bakiye: ₺${tl(m.running)}</div></div>
          </div>
          <div style="font-size:14px;margin-bottom:8px;">${m.desc}</div>
          <div style="display:flex;gap:8px;justify-content:flex-end;border-top:1.5px solid var(--linefaint);padding-top:8px;">
            <button class="btn ghost" style="padding:8px 14px;font-size:13px;" onclick="editEmployeeMovement('${m.id}','${e.id}')">${ICONS.edit} Düzenle</button>
            <button class="btn ghost" style="padding:8px 14px;font-size:13px;color:var(--rust);border-color:var(--rust);" onclick="removeEmployeeMovement('${m.id}')">${ICONS.trash} Sil</button>
          </div>
        </div>`;
      });
    }
    html += `<div class="card" style="padding:16px;">
      <h2 class="serif" style="font-size:16px;margin:0 0 10px;">Notlar</h2>
      ${e.note ? `<div class="muted" style="font-size:13.5px;max-height:44px;overflow:hidden;line-height:1.5;">${e.note}</div>` : `<p class="muted" style="margin:0;">Henüz not eklenmedi.</p>`}
      <div style="display:flex; align-items:center; gap:10px; margin-top:10px;">
        <button class="btn dark" onclick="modalEmployeeNote('${e.id}')">${e.note?'Notu Aç / Düzenle':'Not Ekle'}</button>
      </div>
    </div>`;
  }

  else if(view==='bankLoans'){
    html += `<div class="fab-row" style="justify-content:space-between;"><button class="btn" style="background:var(--teal);" onclick="setView('accounts')">‹‹ Hesaplar</button><span></span></div>`;
    html += `<h1 class="page">Banka Kredileri</h1>`;
    html += `<div class="banner" style="background:#fdf6e3;border:1.5px solid var(--brass);color:var(--navy);padding:12px 14px;border-radius:6px;font-size:12.5px;margin-bottom:14px;">ℹ️ Bu sayfa sadece banka kredilerinizi/borçlarınızı takip etmek içindir. Buradaki tutarlar Net Ciro, Net Gider, Net Kâr veya diğer hiçbir hesaba dahil edilmez — tamamen bağımsız, sadece bilgi amaçlı bir kayıttır.</div>`;
    const totalBankDebt = state.bankLoans.reduce((a,b)=>a+bankLoanBalance(b.id),0);
    html += `<div class="grid3">${heroStat('Toplam Banka Borcu', Math.abs(totalBankDebt), totalBankDebt>0?'bordo':'teal')}</div>`;
    html += `<div class="fab-row"><button class="btn" style="background:var(--brass);color:var(--navy);" onclick="modalBankLoan()">${ICONS.plus} Banka/Kredi Ekle</button></div>`;
    if(state.bankLoans.length===0){ html += `<div class="card"><div class="empty">Henüz banka/kredi eklenmedi.</div></div>`; }
    else {
      html += `<div class="card">`;
      state.bankLoans.forEach(b=>{
        const bal = bankLoanBalance(b.id);
        const balColor = bal>0 ? 'var(--rust)' : (bal<0 ? 'var(--green)' : 'var(--muted)');
        const balLabel = bal>0 ? 'kalan borç' : (bal<0 ? 'fazla ödemişiz' : 'hesap kapalı');
        html += `<div class="row clickable" onclick="openBankLoan('${b.id}')">
          <div><strong>${b.name}</strong></div>
          <div style="text-align:right;"><div class="mono" style="color:${balColor};font-weight:700;">₺${tl(Math.abs(bal))}</div><div class="muted" style="font-size:10.5px;">${balLabel}</div></div>
        </div>`;
      });
      html += `</div>`;
    }
  }

  else if(view==='bankLoanDetail'){
    const b = state.bankLoans.find(x=>x.id===selectedBankLoanId);
    if(!b){ view='bankLoans'; return render(); }
    const bal = bankLoanBalance(b.id);
    const balLabel = bal>0 ? 'Kalan Borç' : (bal<0 ? 'Fazla Ödemişiz' : 'Hesap Kapalı');
    html += `<div class="banner" style="background:#fdf6e3;border:1.5px solid var(--brass);color:var(--navy);padding:10px 14px;border-radius:6px;font-size:12px;margin-bottom:14px;">ℹ️ Bu, diğer hesaplarınızdan bağımsız bir kayıttır.</div>`;
    html += `<div class="fab-row"><button class="btn ghost" onclick="modalBankLoan('${b.id}')">${ICONS.edit} Düzenle</button></div>`;
    html += `<div class="grid3">${statCard(balLabel, Math.abs(bal), 'wallet', bal>0?'bordo':'green')}</div>`;
    html += `<div class="fab-row">
      <button class="btn dark" onclick="modalBankLoanMovement('${b.id}','borc')">${ICONS.plus} Kredi/Borç Ekle</button>
      <button class="btn" onclick="modalBankLoanMovement('${b.id}','odeme')">${ICONS.plus} Ödeme Yaptım</button>
    </div>`;
    const rows = bankLoanMovementsOf(b.id);
    let brunning = 0;
    const bWithRunning = rows.map(m=>{ brunning += m.type==='borc' ? m.amount : -m.amount; return {...m, running:brunning}; });
    if(bWithRunning.length===0){ html += `<div class="card"><div class="empty">Henüz hareket yok.</div></div>`; }
    else {
      bWithRunning.slice().reverse().forEach(m=>{
        const isBorc = m.type==='borc';
        html += `<div class="card" style="padding:14px 16px;margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;">
            <div class="date-strong">${fmtDate(m.date)}</div>
            <div style="text-align:right;"><div class="mono" style="font-size:17px;font-weight:700;color:${isBorc?'var(--rust)':'var(--green)'};">${isBorc?'+':'−'}₺${tl(m.amount)}</div><div class="muted" style="font-size:11px;">Bakiye: ₺${tl(m.running)}</div></div>
          </div>
          <div style="font-size:14px;margin-bottom:8px;">${m.desc}</div>
          <div style="display:flex;gap:8px;justify-content:flex-end;border-top:1.5px solid var(--linefaint);padding-top:8px;">
            <button class="btn ghost" style="padding:8px 14px;font-size:13px;" onclick="editBankLoanMovement('${m.id}','${b.id}')">${ICONS.edit} Düzenle</button>
            <button class="btn ghost" style="padding:8px 14px;font-size:13px;color:var(--rust);border-color:var(--rust);" onclick="removeBankLoanMovement('${m.id}')">${ICONS.trash} Sil</button>
          </div>
        </div>`;
      });
    }
  }

  else if(view==='allnotes'){
    html += `<h1 class="page">Notlar</h1>`;
    html += `<h2 class="subhead" style="margin-top:0;">Genel Notlar</h2>`;
    html += `<div class="card" style="padding:16px;margin-bottom:20px;">
      <textarea id="free-note-input" placeholder="Aklınızdakini yazın…" style="margin-bottom:8px;"></textarea>
      <button class="btn dark" onclick="addFreeNote()">${ICONS.plus} Not Ekle</button>
    </div>`;
    if(state.freeNotes.length){
      html += `<div class="card" style="margin-bottom:20px;">`;
      state.freeNotes.forEach(n=>{ html += `<div class="row"><div><div>${n.text}</div><div class="date-strong">${fmtDate(n.date)}</div></div><button class="icon-btn trash" onclick="removeFreeNote('${n.id}')">${ICONS.trash}</button></div>`; });
      html += `</div>`;
    }
    html += `<h2 class="subhead">Müşteri Notları</h2><p class="muted" style="margin-top:-6px;">Müşteriye dokunarak notunu görüp düzenleyebilirsiniz.</p>`;
    html += `<div class="card">`;
    if(state.customers.length===0){ html += `<div class="empty">Henüz müşteri yok.</div>`; }
    else {
      state.customers.forEach(c=>{
        html += `<div class="row clickable" onclick="openCustomer('${c.id}')">
          <div><div><strong>${c.name}</strong></div><div class="muted" style="font-size:12px; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${c.note ? c.note : 'Not eklenmedi'}</div></div>
        </div>`;
      });
    }
    html += `</div>`;

    html += `<h2 class="subhead">🗑️ Son Silinenler (Çöp Kutusu)</h2><p class="muted" style="margin-top:-6px;">Silinen kayıtlar 30 gün burada bekler, isterseniz geri getirebilirsiniz.</p>`;
    html += `<div class="card">`;
    if(!state.trash.length){ html += `<div class="empty">Çöp kutusu boş.</div>`; }
    else {
      state.trash.forEach(t=>{
        html += `<div class="row"><div><div style="font-size:13.5px;">${trashLabel(t)}</div><div class="muted" style="font-size:11px;">Silinme: ${fmtDate(t.deletedAt)}</div></div><div style="display:flex;gap:6px;"><button class="btn ghost" style="padding:7px 12px;font-size:12.5px;" onclick="restoreTrash('${t.id}')">Geri Getir</button><button class="btn ghost" style="padding:7px 12px;font-size:12.5px;color:var(--rust);border-color:var(--rust);" onclick="permanentDeleteTrash('${t.id}')">Kalıcı Sil</button></div></div>`;
      });
    }
    html += `</div>`;
  }

  app.innerHTML = html;
  const nav = document.getElementById('bottomnav');
  const activeNav = view==='customerDetail' ? 'customers' : (view==='suppliers'||view==='supplierDetail'||view==='employees'||view==='employeeDetail'||view==='bankLoans'||view==='bankLoanDetail') ? 'accounts' : view;
  nav.innerHTML = NAV.map(n=>`<button class="${activeNav===n.id?'active':''}" onclick="setView('${n.id}')">${ICONS[n.icon]}<span>${n.label}</span></button>`).join('');
}

render();
</script>
</body>
</html>
