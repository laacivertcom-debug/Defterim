<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Defterim</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Defterim">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B2027">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230B2027'/%3E%3Ctext x='50' y='68' font-size='55' font-family='Georgia,serif' fill='%23C9A227' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Defterim%22%2C%22short_name%22%3A%22Defterim%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23F6F3EA%22%2C%22theme_color%22%3A%22%230B2027%22%7D">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root{
    --navy:#0B2027; --brass:#C9A227; --teal:#2F6F6B; --rust:#7B2D3E;
    --blue:#1F5C86; --green:#2F7A4D;
    --paper:#F6F3EA; --card:#FBF9F3; --line:#C7BFA6; --linefaint:#EDE8D9; --muted:#8A8267;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--paper); font-family:'Inter',sans-serif; color:var(--navy);}
  body{padding-bottom:72px; min-height:100vh;}
  .serif{font-family:'Fraunces',serif;}
  .mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
  header.top{background:var(--navy); color:#fff; padding:18px 20px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:30;}
  header.top .badge{width:34px; height:34px; border:2px solid var(--brass); border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden;}
  header.top .badge img{width:100%;height:100%;object-fit:cover;}
  header.top .badge span{font-family:'Fraunces',serif; color:var(--brass); font-size:17px;}
  header.top .title{font-family:'Fraunces',serif; font-size:19px; line-height:1.1;}
  header.top .sub{font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.4);}
  header.top .sub a{color:rgba(255,255,255,.75); text-decoration:underline;}
  header.top .back{background:none; border:none; color:#fff; font-size:22px; padding:0 8px 0 0; cursor:pointer;}
  main{padding:18px;}
  h1.page{font-family:'Fraunces',serif; font-size:22px; margin:0 0 4px;}
  h2.subhead{font-family:'Fraunces',serif; font-size:16px; margin:22px 0 10px;}
  .muted{color:var(--muted); font-size:13px;}
  .card{background:var(--card); border:1.5px solid var(--line); border-radius:6px; position:relative; overflow:hidden;}
  .stat{padding:16px; display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:12px;}
  .stat .label{font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:8px;}
  .stat .value{font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600;}
  .stat .icon{width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .grid3{display:grid; grid-template-columns:1fr; gap:10px; margin-bottom:18px;}
  @media(min-width:520px){.grid3{grid-template-columns:1fr 1fr 1fr;}}
  .grid4{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
  @media(min-width:520px){.grid4{grid-template-columns:1fr 1fr 1fr 1fr;}}
  .row{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--linefaint); font-size:14.5px; cursor:default;}
  .row:last-child{border-bottom:none;}
  .row.clickable{cursor:pointer;}
  .row.clickable:active{background:var(--linefaint);}
  .btn{border:none; border-radius:5px; padding:11px 16px; font-size:14px; font-weight:600; color:#fff; background:var(--teal); display:inline-flex; align-items:center; gap:8px; cursor:pointer;}
  .btn.dark{background:var(--navy);}
  .btn.rust{background:var(--rust);}
  .btn.blue{background:var(--blue);}
  .btn.brass{background:var(--brass); color:var(--navy);}
  .btn.ghost{background:transparent; color:var(--navy); border:1.5px solid var(--line);}
  .btn:disabled{opacity:.4;}
  .btn-full{width:100%; justify-content:center; margin-top:6px;}
  .fab-row{display:flex; justify-content:flex-end; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  table{width:100%; border-collapse:collapse; font-size:13.8px;}
  th{text-align:left; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:10px 12px; border-bottom:2px solid var(--line);}
  td{padding:11px 12px; border-bottom:1.5px solid var(--linefaint); vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .empty{padding:24px 16px; color:var(--muted); font-size:13.5px;}
  .field{display:block; margin-bottom:12px;}
  .field span{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700; margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%; border:1.5px solid var(--line); background:#fff; border-radius:5px; padding:10px 11px; font-size:15px; font-family:inherit; color:var(--navy);}
  .field textarea{resize:vertical; min-height:70px;}
  .field.check{display:flex; align-items:center; gap:8px;}
  .field.check input{width:auto;}
  .field.check span{margin:0; text-transform:none; font-weight:500; font-size:14px; color:var(--navy);}
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; z-index:50;}
  @media(min-width:520px){.modal-bg{align-items:center;}}
  .modal{background:var(--card); width:100%; max-width:480px; border-radius:14px 14px 0 0; border:1.5px solid var(--line); max-height:90vh; overflow-y:auto;}
  @media(min-width:520px){.modal{border-radius:8px;}}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1.5px solid var(--line); position:sticky; top:0; background:var(--card); z-index:2;}
  .modal-head h3{font-family:'Fraunces',serif; margin:0; font-size:17px;}
  .modal-head button{background:none; border:none; font-size:20px; color:var(--muted); cursor:pointer;}
  .modal-body{padding:18px;}
  .pill{font-size:11px; padding:3px 10px; border-radius:99px; font-weight:700; white-space:nowrap; display:inline-block;}
  .type-toggle{display:flex; gap:8px;}
  .type-toggle button{flex:1; padding:9px; border-radius:5px; border:1.5px solid var(--line); background:#fff; font-weight:600; font-size:13.5px; cursor:pointer;}
  nav.bottom{position:fixed; bottom:0; left:0; right:0; background:var(--navy); display:flex; z-index:40; border-top:1px solid rgba(255,255,255,.08);}
  nav.bottom button{flex:1; background:none; border:none; color:rgba(255,255,255,.55); padding:9px 2px 8px; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; font-family:inherit; cursor:pointer;}
  nav.bottom button.active{color:var(--brass);}
  nav.bottom svg{width:19px; height:19px;}
  .icon-btn{background:none; border:none; cursor:pointer; padding:5px;}
  .icon-btn svg{width:19px; height:19px; display:block;}
  .icon-btn.trash{color:var(--rust);}
  .icon-btn.edit{color:var(--teal);}
  .lineitem{border:1.5px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px; background:#fff; position:relative;}
  .lineitem .top-row{display:flex; gap:8px; align-items:flex-end; margin-bottom:8px;}
  .mic-btn{width:38px; height:38px; border-radius:50%; border:none; background:var(--teal); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer;}
  .mic-btn.listening{background:var(--rust); animation:pulse 1s infinite;}
  .mic-big{width:64px; height:64px; font-size:0;}
  .mic-big svg{width:28px; height:28px;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
  .kdv-row{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); margin-bottom:6px;}
  .kdv-row input[type=checkbox]{width:auto;}
  .kdv-row input[type=number]{width:60px; padding:5px 7px;}
  .line-remove{position:absolute; top:8px; right:8px; background:none; border:none; color:var(--muted); cursor:pointer;}
  .line-total{text-align:right; font-size:13px; color:var(--navy); font-weight:600;}
  .voice-hint{font-size:11.5px; color:var(--muted); margin-top:-4px; margin-bottom:10px;}
  .thumb{width:36px; height:36px; border-radius:5px; object-fit:cover; border:1.5px solid var(--line); flex-shrink:0;}
  .avatar{width:44px; height:44px; border-radius:50%; object-fit:cover; border:1.5px solid var(--line); flex-shrink:0; background:var(--linefaint);}
  .voice-cta{padding:18px; text-align:center; margin-bottom:18px; border:2px dashed var(--brass);}
  .voice-cta .mic-big{margin:0 auto 10px;}
  .kv-hint{font-size:12px; color:var(--muted); margin-top:4px;}
  .overdue-tag{font-size:11px; color:var(--rust); font-weight:700; margin-top:2px;}
  .date-strong{color:var(--navy); font-weight:700; font-size:13.5px;}
  .reminder-row{display:flex; justify-content:space-between; align-items:center; padding:11px 16px; border-bottom:1.5px solid var(--linefaint); cursor:pointer;}
  .reminder-row:last-child{border-bottom:none;}
  .reminder-row:active{background:var(--linefaint);}
  .badge-days{font-size:11px; font-weight:700; padding:4px 10px; border-radius:99px; color:#fff; white-space:nowrap;}
  a.tel-link{color:var(--blue); text-decoration:none; font-weight:600;}
  .product-pick{display:flex; align-items:center; gap:10px; border:1.5px solid var(--line); border-radius:6px; padding:10px; background:#fff; cursor:pointer; margin-bottom:8px;}
  .product-pick .ph{width:40px;height:40px;border-radius:6px;background:var(--linefaint);display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;}
</style>
</head>
<body>
<header class="top" id="topheader"></header>
<main id="app"></main>
<nav class="bottom" id="bottomnav"></nav>

<script>
const ICONS = {
  dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><circle cx="17" cy="8.5" r="2.6"/><path d="M15.5 14.3c2.6.4 5 2.4 5 5.7"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>',
  wallet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="6" width="19" height="14" rx="2"/><path d="M2.5 10h19"/><circle cx="17" cy="15" r="1.3" fill="currentColor" stroke="none"/></svg>',
  notes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l5 5v13H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 17h5"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 17l6-6 4 4 6-8"/><path d="M14 6h6v6"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7l6 6 4-4 6 8"/><path d="M14 18h6v-6"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 19v3"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>',
  download:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v13"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>',
  upload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V7"/><path d="M7 12l5-5 5 5"/><path d="M4 20h16"/></svg>',
  box2:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>',
};
const NAV = [
  {id:'dashboard', label:'Panel', icon:'dashboard'},
  {id:'customers', label:'Müşteriler', icon:'users'},
  {id:'products', label:'Ürünler', icon:'box'},
  {id:'accounts', label:'Hesaplar', icon:'wallet'},
  {id:'allnotes', label:'Notlar', icon:'notes'},
];
const uid = () => Math.random().toString(36).slice(2,10);
const tl = n => (Number(n)||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
function parseAmount(raw){
  if(raw==null) return 0;
  let s = String(raw).trim();
  if(s==='') return 0;
  const hasComma = s.includes(',');
  if(hasComma){
    s = s.replace(/\./g,'').replace(',', '.');
  } else {
    const dotCount = (s.match(/\./g)||[]).length;
    if(dotCount>=2){
      const lastIdx = s.lastIndexOf('.');
      const intPart = s.slice(0,lastIdx).replace(/\./g,'');
      const decPart = s.slice(lastIdx+1);
      s = intPart + '.' + decPart;
    } else if(dotCount===1){
      const parts = s.split('.');
      if(parts[1].length===3){ s = parts.join(''); }
    }
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => new Date(d).toLocaleDateString('tr-TR',{day:'2-digit',month:'short',year:'numeric'});
const VAT_DEFAULT = 20;
function addMonths(dateStr, n){ const d = new Date(dateStr||today()); d.setMonth(d.getMonth()+n); return d.toISOString().slice(0,10); }

const STORE_KEY = 'defterim_data_v3';
function loadState(){
  let s = null;
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw) s = JSON.parse(raw); }catch(e){}
  if(!s){ try{ const old = localStorage.getItem('defterim_data_v2'); if(old) s = JSON.parse(old); }catch(e){} }
  if(!s) s = {customers:[], products:[], movements:[], ledger:[], freeNotes:[]};
  s.freeNotes = s.freeNotes || [];
  s.pin = s.pin || null;
  s.trash = (s.trash||[]).filter(t=> (new Date(today())-new Date(t.deletedAt))/86400000 <= 30);
  s.suppliers = s.suppliers || [];
  s.supplierMovements = s.supplierMovements || [];
  s.customers = (s.customers||[]).map(c=>({ id:c.id, name:c.name, phone:c.phone, note:c.note||'', image:c.image||null, address:c.address||'', tckn:c.tckn||'', taxId:c.taxId||'', taxOffice:c.taxOffice||'' }));
  s.ledger = (s.ledger||[]).map(l=>({
    id:l.id, date:l.date, type:l.type, category:l.category||'Genel', desc:l.desc,
    baseAmount: l.baseAmount!=null? l.baseAmount : l.amount, kdvOn: l.kdvOn||false, kdvPct: l.kdvPct||VAT_DEFAULT,
    amount: l.amount
  }));
  return s;
}
let state = loadState();
let view = 'dashboard';
let selectedCustomerId = null;
let selectedSupplierId = null;
let customerSearchQuery = '';
function onCustomerSearch(val){
  customerSearchQuery = val;
  render();
  const el = document.getElementById('customer-search');
  if(el){ el.focus(); const p = el.value.length; el.setSelectionRange(p,p); }
}
function startCustomerSearchVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('Bu tarayıcı sesli komutu desteklemiyor. Chrome (Android) kullanmayı deneyin.'); return; }
  startVoiceGeneric(SR, (text)=>{ onCustomerSearch(text.trim()); }, 'mic-customer-search');
}

function persist(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }

// ---------- PIN güvenlik sistemi ----------
let pendingPinSuccess = null;
function requirePin(onSuccess){
  pendingPinSuccess = onSuccess;
  if(!state.pin){ openModal(pinSetupHtml()); }
  else { openModal(pinEnterHtml()); }
  setTimeout(()=>document.getElementById('pin-input')?.focus(), 80);
}
function pinSetupHtml(){
  return `<div class="modal-bg" onclick="if(event.target===this){pendingPinSuccess=null;closeModal();}">
    <div class="modal"><div class="modal-head"><h3>Güvenlik PIN'i Oluştur</h3><button onclick="pendingPinSuccess=null;closeModal()">&times;</button></div>
      <div class="modal-body">
        <p class="muted" style="margin-bottom:14px;">Silme işlemlerini yanlışlıkla yapmamak için 4 haneli bir PIN belirleyin. Bunu hatırlayın, silme işlemlerinde her seferinde soracağız.</p>
        <label class="field"><span>4 Haneli PIN</span><input id="pin-input" type="tel" maxlength="4" inputmode="numeric" placeholder="••••"></label>
        <label class="field"><span>PIN'i Tekrar Yazın</span><input id="pin-input2" type="tel" maxlength="4" inputmode="numeric" placeholder="••••"></label>
        <div id="pin-error" style="color:var(--rust);font-size:13px;margin-bottom:10px;"></div>
        <button class="btn dark btn-full" onclick="submitPinSetup()">PIN'i Kaydet ve Devam Et</button>
      </div>
    </div></div>`;
}
function submitPinSetup(){
  const p1 = document.getElementById('pin-input').value.trim();
  const p2 = document.getElementById('pin-input2').value.trim();
  const err = document.getElementById('pin-error');
  if(!/^\d{4}$/.test(p1)){ err.textContent='4 haneli sayı girin.'; return; }
  if(p1!==p2){ err.textContent='PIN\'ler uyuşmuyor, tekrar deneyin.'; return; }
  state.pin = p1; persist();
  closeModal();
  const cb = pendingPinSuccess; pendingPinSuccess = null;
  if(cb) cb();
}
function pinEnterHtml(){
  return `<div class="modal-bg" onclick="if(event.target===this){pendingPinSuccess=null;closeModal();}">
    <div class="modal"><div class="modal-head"><h3>PIN Girin</h3><button onclick="pendingPinSuccess=null;closeModal()">&times;</button></div>
      <div class="modal-body">
        <p class="muted" style="margin-bottom:14px;">Bu işlem için güvenlik PIN'inizi girin.</p>
        <label class="field"><span>PIN</span><input id="pin-input" type="tel" maxlength="4" inputmode="numeric" placeholder="••••" onkeydown="if(event.key==='Enter')submitPinEnter()"></label>
        <div id="pin-error" style="color:var(--rust);font-size:13px;margin-bottom:10px;"></div>
        <button class="btn dark btn-full" onclick="submitPinEnter()">Onayla</button>
        <button class="btn ghost btn-full" onclick="forgotPin()">PIN'i unuttum</button>
      </div>
    </div></div>`;
}
function submitPinEnter(){
  const p = document.getElementById('pin-input').value.trim();
  if(p !== state.pin){ document.getElementById('pin-error').textContent = 'Yanlış PIN, tekrar deneyin.'; return; }
  closeModal();
  const cb = pendingPinSuccess; pendingPinSuccess = null;
  if(cb) cb();
}
function forgotPin(){
  if(!confirm('PIN sıfırlanacak ve bir dahaki işlemde yeni bir PIN belirlemeniz istenecek. Devam edilsin mi?')) return;
  state.pin = null; persist();
  closeModal();
  const cb = pendingPinSuccess; pendingPinSuccess = null;
  if(cb) requirePin(cb);
}

// ---------- çöp kutusu (son silinenler) ----------
function trashAdd(type, payload){
  state.trash.unshift({id:uid(), type, deletedAt:today(), payload});
  persist();
}
function permanentDeleteTrash(trashId){
  requirePin(()=>{ state.trash = state.trash.filter(x=>x.id!==trashId); persist(); render(); });
}
function restoreTrash(trashId){
  const t = state.trash.find(x=>x.id===trashId); if(!t) return;
  if(t.type==='customer'){
    state.customers.push(t.payload.customer);
    (t.payload.movements||[]).forEach(m=>{
      state.movements.push(m);
      if(m.type==='teslim' && m.items){ m.items.forEach(it=>{ if(it.productId){ const p=state.products.find(p=>p.id===it.productId); if(p&&p.stock!=null) p.stock=Math.max(0,p.stock-it.qty); } }); }
    });
  } else if(t.type==='product'){ state.products.push(t.payload); }
  else if(t.type==='ledger'){ state.ledger.push(t.payload); }
  else if(t.type==='movement'){
    state.movements.push(t.payload);
    if(t.payload.type==='teslim' && t.payload.items){ t.payload.items.forEach(it=>{ if(it.productId){ const p=state.products.find(p=>p.id===it.productId); if(p&&p.stock!=null) p.stock=Math.max(0,p.stock-it.qty); } }); }
  }
  else if(t.type==='supplier'){
    state.suppliers.push(t.payload.supplier);
    (t.payload.movements||[]).forEach(m=> state.supplierMovements.push(m));
  }
  else if(t.type==='supplierMovement'){ state.supplierMovements.push(t.payload); }
  state.trash = state.trash.filter(x=>x.id!==trashId);
  persist(); render();
}
function trashLabel(t){
  if(t.type==='customer') return `Müşteri: ${t.payload.customer.name}`;
  if(t.type==='product') return `Ürün: ${t.payload.name}`;
  if(t.type==='ledger') return `${t.payload.type==='gelir'?'Gelir':'Gider'}: ${t.payload.desc} — ₺${tl(t.payload.amount)}`;
  if(t.type==='movement') return `${t.payload.type==='teslim'?'Teslimat':'Ödeme'}: ${t.payload.desc||''} — ₺${tl(t.payload.total)}`;
  if(t.type==='supplier') return `Tedarikçi: ${t.payload.supplier.name}`;
  if(t.type==='supplierMovement') return `Tedarikçi ${t.payload.type==='borc'?'Borç':'Ödeme'}: ${t.payload.desc} — ₺${tl(t.payload.amount)}`;
  return 'Kayıt';
}

// ---------- voice parsing ----------
const ONES = {sıfır:0,bir:1,iki:2,üç:3,dört:4,beş:5,altı:6,yedi:7,sekiz:8,dokuz:9};
const TENS = {on:10,yirmi:20,otuz:30,kırk:40,elli:50,altmış:60,yetmiş:70,seksen:80,doksan:90};
const FILLER = new Set(['artı','eşittir','kdv','ve','lira','liradan','tl','tane','adet']);
function isNumberWord(tok){ return ONES.hasOwnProperty(tok) || TENS.hasOwnProperty(tok) || tok==='yüz' || tok==='bin' || /^\d+([.,]\d+)?$/.test(tok); }
function wordsToNumber(tokens){
  let total=0, current=0;
  for(const tok of tokens){
    if(tok==='yüz'){ current = (current===0?1:current)*100; }
    else if(tok==='bin'){ total += (current===0?1:current)*1000; current=0; }
    else if(TENS.hasOwnProperty(tok)) current += TENS[tok];
    else if(ONES.hasOwnProperty(tok)) current += ONES[tok];
    else if(/^\d+([.,]\d+)?$/.test(tok)) current += parseFloat(tok.replace(',','.'));
  }
  return total+current;
}
function tokenizeGrouped(text){
  const rawTokens = text.toLowerCase().replace(/[.,](?!\d)/g,'').split(/\s+/).filter(Boolean);
  const grouped = []; let buf = [];
  function flush(){ if(buf.length){ grouped.push({num: wordsToNumber(buf)}); buf=[]; } }
  for(const tok of rawTokens){ if(isNumberWord(tok)) buf.push(tok); else { flush(); grouped.push({word:tok}); } }
  flush(); return grouped;
}
function parseItemFromGrouped(grouped){
  let qty=null, price=null;
  for(let i=0;i<grouped.length;i++){ if(grouped[i].num!==undefined && grouped[i+1] && (grouped[i+1].word==='tane' || grouped[i+1].word==='adet')){ qty = grouped[i].num; grouped[i]._used='qty'; grouped[i+1]._used='qty'; break; } }
  for(let i=grouped.length-1;i>=0;i--){ if(grouped[i].num!==undefined && grouped[i+1] && ['lira','liradan','tl'].includes(grouped[i+1].word)){ price = grouped[i].num; grouped[i]._used='price'; grouped[i+1]._used='price'; break; } }
  if(price===null){ for(let i=grouped.length-1;i>=0;i--){ if(grouped[i].num!==undefined && !grouped[i]._used){ price=grouped[i].num; grouped[i]._used='price'; break; } } }
  const nameParts = grouped.filter(g=> !g._used && g.word && !FILLER.has(g.word)).map(g=>g.word);
  return { qty: qty||1, price: price||0, productName: nameParts.join(' ').trim() };
}
function parseVoiceLine(text){ return parseItemFromGrouped(tokenizeGrouped(text)); }
function parseFullDeliveryVoice(text){
  const grouped = tokenizeGrouped(text);
  let qtyIdx=-1;
  for(let i=0;i<grouped.length;i++){ if(grouped[i].num!==undefined && grouped[i+1] && (grouped[i+1].word==='tane' || grouped[i+1].word==='adet')){ qtyIdx=i; break; } }
  let customerName=''; let itemGrouped = grouped;
  if(qtyIdx>=0){ customerName = grouped.slice(0,qtyIdx).filter(g=>g.word && !FILLER.has(g.word)).map(g=>g.word).join(' '); itemGrouped = grouped.slice(qtyIdx); }
  const item = parseItemFromGrouped(itemGrouped);
  return { customerName: customerName.trim(), ...item };
}
function parseFullDeliveryVoiceMulti(text){
  const grouped = tokenizeGrouped(text);
  const qtyMarkers = [];
  for(let i=0;i<grouped.length;i++){ if(grouped[i].num!==undefined && grouped[i+1] && (grouped[i+1].word==='tane' || grouped[i+1].word==='adet')){ qtyMarkers.push(i); } }
  let customerName=''; let items=[];
  if(!qtyMarkers.length){ return { customerName:'', items:[] }; }
  customerName = grouped.slice(0,qtyMarkers[0]).filter(g=>g.word && !FILLER.has(g.word)).map(g=>g.word).join(' ');
  for(let m=0;m<qtyMarkers.length;m++){
    const start = qtyMarkers[m];
    const end = m+1<qtyMarkers.length ? qtyMarkers[m+1] : grouped.length;
    const chunk = grouped.slice(start, end).map(g=>({...g}));
    items.push(parseItemFromGrouped(chunk));
  }
  return { customerName: customerName.trim(), items };
}
function matchProductByName(name){
  if(!name) return null;
  const n = name.toLowerCase();
  return state.products.find(p => { const pn=p.name.toLowerCase(); return pn===n || pn.includes(n) || n.includes(pn); }) || null;
}
let activeRecognitions = {};
function startVoiceGeneric(SR, onText, btnId){
  const btn = btnId ? document.getElementById(btnId) : null;
  const statusEl = btnId ? document.getElementById(btnId+'-status') : null;
  if(activeRecognitions[btnId]){
    try{ activeRecognitions[btnId].abort(); }catch(e){}
    delete activeRecognitions[btnId];
    if(btn) btn.classList.remove('listening');
    if(statusEl) statusEl.textContent='';
    return;
  }
  const rec = new SR();
  rec.lang = 'tr-TR'; rec.continuous = false; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onstart = ()=>{ if(btn) btn.classList.add('listening'); if(statusEl) statusEl.textContent='🔴 Dinleniyor… konuşun'; };
  rec.onresult = (e)=>{
    const text = e.results[0][0].transcript.trim();
    if(statusEl) statusEl.textContent = text ? '✅ Alındı' : '';
    if(text) onText(text);
  };
  rec.onerror = ()=>{ if(statusEl) statusEl.textContent='Anlaşılamadı, tekrar deneyin.'; };
  rec.onend = ()=>{ if(btn) btn.classList.remove('listening'); delete activeRecognitions[btnId]; };
  activeRecognitions[btnId] = rec;
  rec.start();
}
function startVoice(rowId){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('Bu tarayıcı sesli komutu desteklemiyor. Chrome (Android) kullanmayı deneyin.'); return; }
  startVoiceGeneric(SR, (text)=>{
    const parsed = parseVoiceLine(text);
    const qtyEl = document.getElementById('qty-'+rowId);
    const nameEl = document.getElementById('name-'+rowId);
    const priceEl = document.getElementById('price-'+rowId);
    if(qtyEl) qtyEl.value = parsed.qty;
    if(nameEl) nameEl.value = parsed.productName || nameEl.value;
    if(priceEl) priceEl.value = parsed.price;
    recalcLine(rowId);
  }, 'mic-'+rowId);
}

let editingProductId = null;
function onProductImageSelect(input){
  const file = input.files && input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{ pendingProductImage = e.target.result; const prev = document.getElementById('product-img-preview'); if(prev){ prev.src = pendingProductImage; prev.style.display='block'; } };
  reader.readAsDataURL(file);
}
function recalcProductVat(){
  const price = parseAmount(document.getElementById('f-price').value||0);
  const el = document.getElementById('product-vat-hint');
  if(el) el.textContent = price ? `KDV dahil: ₺${tl(price*1.2)}` : '';
}
function removeProduct(id){
  const p = state.products.find(x=>x.id===id); if(!p) return;
  requirePin(()=>{ trashAdd('product', p); state.products = state.products.filter(p=>p.id!==id); persist(); render(); });
}
function modalProduct(editId){
  editingProductId = editId || null; pendingProductImage = null;
  const p = editId ? state.products.find(x=>x.id===editId) : null;
  openModal(`
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-head"><h3>${p?'Ürünü Düzenle':'Yeni Ürün'}</h3><button onclick="closeModal()">&times;</button></div>
        <div class="modal-body">
          <label class="field"><span>Ürün Adı (boyu ile birlikte yazın, örn. "Aktif Karbon 10L")</span><input id="f-pname" value="${p?p.name:''}"></label>
          <label class="field"><span>Birim Fiyat — KDV Hariç (₺)</span><input id="f-price" type="text" inputmode="decimal" value="${p?p.price:''}" oninput="recalcProductVat()"></label>
          <div class="kv-hint" id="product-vat-hint">${p?`KDV dahil: ₺${tl(p.price*1.2)}`:''}</div>
          <label class="field" style="margin-top:12px;"><span>Stok Adedi (opsiyonel, boş bırakabilirsiniz)</span><input id="f-stock" type="number" value="${p&&p.stock!=null?p.stock:''}"></label>
          <label class="field"><span>Ürün Görseli (opsiyonel)</span><input type="file" accept="image/*" onchange="onProductImageSelect(this)"></label>
          <img id="product-img-preview" src="${p&&p.image?p.image:''}" style="${p&&p.image?'':'display:none;'}max-width:100%;border-radius:6px;margin-bottom:10px;border:1.5px solid var(--line);">
          <button class="btn dark btn-full" onclick="submitProduct()">Kaydet</button>
        </div>
      </div>
    </div>`);
}
function submitProduct(){
  const name = document.getElementById('f-pname').value.trim();
  const priceRaw = document.getElementById('f-price').value;
  const price = parseAmount(priceRaw);
  const stock = document.getElementById('f-stock').value;
  if(!name || priceRaw==='') return;
  if(editingProductId){
    const p = state.products.find(x=>x.id===editingProductId);
    if(p){ p.name=name; p.price=price; p.stock = stock===''?null:Number(stock); if(pendingProductImage) p.image = pendingProductImage; }
  } else {
    state.products.push({id:uid(), name, price, stock: stock===''?null:Number(stock), image: pendingProductImage});
  }
  editingProductId = null; pendingProductImage = null;
  persist(); closeModal(); render();
}

// ---------- ledger actions ----------
function removeLedger(id){
  const l = state.ledger.find(x=>x.id===id); if(!l) return;
  requirePin(()=>{ trashAdd('ledger', l); state.ledger = state.ledger.filter(l=>l.id!==id); persist(); render(); });
}
const EXPENSE_CATEGORIES = ['Mal Alımı','Nakliye / Dağıtım','Forklift / Depo','Personel','Kira / Fatura','Diğer'];
let ledgerType = 'gider';
let editingLedgerId = null;
function modalLedger(editId){
  editingLedgerId = editId || null;
  const l = editId ? state.ledger.find(x=>x.id===editId) : null;
  ledgerType = l ? l.type : 'gider';
  const currentCat = l ? l.category : 'Mal Alımı';
  const isKnownCat = EXPENSE_CATEGORIES.includes(currentCat);
  const catOptions = EXPENSE_CATEGORIES.map(cat=>`<option value="${cat}" ${cat===currentCat?'selected':''}>${cat}</option>`).join('');
  openModal(`
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-head"><h3>${l?'Kaydı Düzenle':'Gider Ekle'}</h3><button onclick="closeModal()">&times;</button></div>
        <div class="modal-body">
          <label class="field"><span>Tür</span>
            <div class="type-toggle"><button id="t-gider" onclick="setLedgerType('gider')">Gider</button><button id="t-gelir" onclick="setLedgerType('gelir')">Gelir (nadir)</button></div>
          </label>
          <label class="field"><span>Kategori</span><select id="f-category" onchange="onCategoryChange()">${catOptions}</select></label>
          <label class="field" id="f-category-other-wrap" style="${isKnownCat?'display:none;':''}"><span>Kategori adı yazın</span><input id="f-category-other" value="${isKnownCat?'':currentCat}"></label>
          <label class="field"><span>Açıklama</span><input id="f-desc" value="${l?l.desc:''}" placeholder="Örn. Tır nakliyesi, forklift kirası…"></label>
          <label class="field"><span>Tutar (₺)</span><input id="f-amount" type="text" inputmode="decimal" value="${l?l.baseAmount:''}" oninput="recalcLedgerVat()"></label>
          <div class="kdv-row"><input type="checkbox" id="f-kdvon" ${l&&l.kdvOn?'checked':''} onchange="recalcLedgerVat()"> KDV ekle (opsiyonel) <input type="number" id="f-kdvpct" value="${l?l.kdvPct:VAT_DEFAULT}" oninput="recalcLedgerVat()"> %</div>
          <div class="kv-hint" id="ledger-vat-hint" style="margin-bottom:12px;"></div>
          <button class="btn dark btn-full" onclick="submitLedger()">Kaydet</button>
        </div>
      </div>
    </div>`);
  setLedgerType(ledgerType); recalcLedgerVat();
}
function onCategoryChange(){
  const sel = document.getElementById('f-category').value;
  const wrap = document.getElementById('f-category-other-wrap');
  if(wrap) wrap.style.display = sel==='Diğer' ? '' : 'none';
}
function setLedgerType(t){
  ledgerType = t;
  const gider = document.getElementById('t-gider'), gelir = document.getElementById('t-gelir');
  if(!gider||!gelir) return;
  if(t==='gider'){ gider.style.background='var(--rust)'; gider.style.color='#fff'; gider.style.borderColor='var(--rust)'; gelir.style.background=''; gelir.style.color='var(--navy)'; gelir.style.borderColor='var(--line)'; }
  else { gelir.style.background='var(--green)'; gelir.style.color='#fff'; gelir.style.borderColor='var(--green)'; gider.style.background=''; gider.style.color='var(--navy)'; gider.style.borderColor='var(--line)'; }
}
function recalcLedgerVat(){
  const base = parseAmount(document.getElementById('f-amount')?.value||0);
  const kdvOn = document.getElementById('f-kdvon')?.checked;
  const kdvPct = Number(document.getElementById('f-kdvpct')?.value||0);
  const final = kdvOn ? base*(1+kdvPct/100) : base;
  const el = document.getElementById('ledger-vat-hint');
  if(el) el.textContent = base ? `KDV dahil toplam: ₺${tl(final)}` : '';
}
function submitLedger(){
  const catSel = document.getElementById('f-category').value;
  const category = catSel==='Diğer' ? (document.getElementById('f-category-other').value.trim()||'Diğer') : catSel;
  const desc = document.getElementById('f-desc').value.trim();
  const base = parseAmount(document.getElementById('f-amount').value);
  const kdvOn = document.getElementById('f-kdvon').checked;
  const kdvPct = Number(document.getElementById('f-kdvpct').value);
  if(!desc || !base || base<=0) return;
  const amount = kdvOn ? base*(1+kdvPct/100) : base;
  if(editingLedgerId){
    const l = state.ledger.find(x=>x.id===editingLedgerId);
    if(l){ l.type=ledgerType; l.category=category; l.desc=desc; l.baseAmount=base; l.kdvOn=kdvOn; l.kdvPct=kdvPct; l.amount=amount; }
  } else { state.ledger.unshift({id:uid(), date:today(), type:ledgerType, category, desc, baseAmount:base, kdvOn, kdvPct, amount}); }
  editingLedgerId = null;
  persist(); closeModal(); render();
}
function modalExpenseBreakdown(){
  const giderler = state.ledger.filter(l=>l.type==='gider');
  const groups = {};
  giderler.forEach(l=>{ (groups[l.category]=groups[l.category]||[]).push(l); });
  const cats = Object.keys(groups).sort();
  let body = '';
  if(!cats.length){ body = `<p class="muted">Henüz bir gider kaydı yok.</p>`; }
  else {
    cats.forEach(cat=>{
      const items = groups[cat];
      const subtotal = items.reduce((a,l)=>a+l.amount,0);
      body += `<div style="margin-bottom:16px;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;"><strong class="serif" style="font-size:15px;">${cat}</strong><span class="mono" style="color:var(--rust);font-weight:700;">₺${tl(subtotal)}</span></div>`;
      items.forEach(l=>{
        body += `<div class="row" style="padding:8px 0;">
          <div><div style="font-size:13.5px;">${l.desc}</div><div class="muted" style="font-size:11px;">${fmtDate(l.date)} · KDV hariç ₺${tl(l.baseAmount)}${l.kdvOn?` +%${l.kdvPct} KDV`:''}</div></div>
          <div style="display:flex;align-items:center;gap:6px;">
            <span class="mono" style="color:var(--rust);">₺${tl(l.amount)}</span>
            <button class="icon-btn edit" onclick="closeModal();modalLedger('${l.id}')">${ICONS.edit}</button>
            <button class="icon-btn trash" onclick="removeLedger('${l.id}')">${ICONS.trash}</button>
          </div>
        </div>`;
      });
      body += `</div>`;
    });
  }
  openModal(`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h3>Gider Dökümü</h3><button onclick="closeModal()">&times;</button></div><div class="modal-body">${body}</div></div></div>`);
}

// ---------- movement actions ----------
function revertStock(m){ if(m.type==='teslim' && m.items){ m.items.forEach(it=>{ if(it.productId){ const p=state.products.find(p=>p.id===it.productId); if(p && p.stock!=null) p.stock += it.qty; } }); } }
function removeMovement(id){
  const m = state.movements.find(x=>x.id===id); if(!m) return;
  requirePin(()=>{
    revertStock(m);
    trashAdd('movement', m);
    state.movements = state.movements.filter(x=>x.id!==id);
    persist(); render();
  });
}

let deliveryLines = [];
let editingMovementId = null;
let dueDateManual = false;
let deliveryDraftMeta = {date:null, dueDate:null, invoiced:false, paid:false};

function modalDelivery(customerId){
  editingMovementId=null; dueDateManual=false;
  deliveryLines = [{id:uid(), productId:'', name:'', qty:1, price:0, kdvOn:true, kdvPct:VAT_DEFAULT}];
  openDeliveryModal(customerId);
}
function editMovement(id, customerId){
  const m = state.movements.find(x=>x.id===id);
  if(!m) return;
  if(m.type==='odeme'){ requirePin(()=>editPaymentModal(m)); return; }
  editingMovementId = id; dueDateManual = true;
  deliveryLines = m.items.map(it=>({id:uid(), productId:it.productId||'', name:it.name, qty:it.qty, price: it.unitPrice, kdvOn:false, kdvPct:0}));
  openDeliveryModal(customerId, m);
}
function captureDeliveryDraftMeta(){
  deliveryDraftMeta.date = document.getElementById('f-date')?.value;
  deliveryDraftMeta.dueDate = document.getElementById('f-duedate')?.value;
  deliveryDraftMeta.invoiced = document.getElementById('f-invoiced')?.checked;
  const paidEl = document.getElementById('f-paid'); deliveryDraftMeta.paid = paidEl?paidEl.checked:false;
}
function restoreDeliveryDraftMeta(){
  const d=document.getElementById('f-date'); if(d&&deliveryDraftMeta.date) d.value=deliveryDraftMeta.date;
  const dd=document.getElementById('f-duedate'); if(dd&&deliveryDraftMeta.dueDate) dd.value=deliveryDraftMeta.dueDate;
  const inv=document.getElementById('f-invoiced'); if(inv) inv.checked=deliveryDraftMeta.invoiced;
  const paid=document.getElementById('f-paid'); if(paid) paid.checked=deliveryDraftMeta.paid;
}
function openDeliveryModal(customerId, existing){
  const productNames = state.products.map(p=>`<option value="${p.name}">`).join('');
  const defaultDate = existing?existing.date:today();
  const defaultDue = existing?(existing.dueDate||''):addMonths(defaultDate,1);
  openModal(`
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-head"><h3>${existing?'Teslimatı Düzenle':'Teslimat Ekle'}</h3><button onclick="closeModal()">&times;</button></div>
        <div class="modal-body">
          <label class="field"><span>Tarih</span><input id="f-date" type="date" value="${defaultDate}" onchange="onDeliveryDateChange()"></label>
          <label class="field"><span>Vade Tarihi (varsayılan: 1 ay sonrası, isterseniz değiştirin)</span><input id="f-duedate" type="date" value="${defaultDue}" onchange="dueDateManual=true"></label>
          <datalist id="product-list">${productNames}</datalist>
          <div id="lines-container"></div>
          <button class="btn ghost btn-full" style="margin-bottom:14px;" onclick="addDeliveryLine('${customerId}')">${ICONS.plus} Ürün Satırı Ekle</button>
          ${existing?'':`<label class="field check"><input type="checkbox" id="f-paid"> <span>Peşin ödendi (borç oluşturma)</span></label>`}
          <label class="field check"><input type="checkbox" id="f-invoiced" ${existing&&existing.invoiced?'checked':''}> <span>Fatura kesildi</span></label>
          <div class="card" style="padding:12px 14px;margin-bottom:12px;"><div class="muted" style="font-size:11px;text-transform:uppercase;">Genel Toplam (KDV dahil)</div><div class="mono" id="grand-total" style="font-size:20px;"></div></div>
          <button class="btn dark btn-full" onclick="submitDelivery('${customerId}')">${existing?'Değişiklikleri Kaydet':'Teslimatı Kaydet'}</button>
        </div>
      </div>
    </div>`);
  renderDeliveryLines(customerId);
}
function onDeliveryDateChange(){
  if(dueDateManual) return;
  const d = document.getElementById('f-date').value;
  const dd = document.getElementById('f-duedate');
  if(dd) dd.value = addMonths(d,1);
}
function renderDeliveryLines(customerId){
  const c = document.getElementById('lines-container');
  if(!c) return;
  c.innerHTML = deliveryLines.map(l => `
    <div class="lineitem">
      ${deliveryLines.length>1 ? `<button class="line-remove" onclick="removeDeliveryLine('${l.id}','${customerId}')">${ICONS.close}</button>`:''}
      <button class="product-pick" style="width:100%;" onclick="openProductPicker('${l.id}','${customerId}')">
        ${l.productId && state.products.find(p=>p.id===l.productId)?.image ? `<img src="${state.products.find(p=>p.id===l.productId).image}" class="thumb">` : `<div class="ph">${ICONS.box2}</div>`}
        <div style="text-align:left;flex:1;"><strong>${l.name||'Ürün Seç'}</strong>${l.name?`<div class="muted" style="font-size:11.5px;">Değiştirmek için dokunun</div>`:`<div class="muted" style="font-size:11.5px;">Kayıtlı ürünlerden seçin</div>`}</div>
      </button>
      <div class="top-row" style="margin-top:8px;">
        <button class="mic-btn" id="mic-${l.id}" onclick="startVoice('${l.id}')" title="Sesli söyle">${ICONS.mic}</button>
        <label class="field" style="flex:1;margin:0;"><span>veya elle yazın</span><input id="name-${l.id}" list="product-list" value="${l.name}" oninput="onLineNameInput('${l.id}')"></label>
      </div>
      <div class="voice-hint">Mikrofona basıp örn. "yetmiş beş tane aktif karbon yüz elli liradan" diyebilirsiniz</div>
      <div class="voice-hint" id="mic-${l.id}-status" style="font-weight:700;color:var(--rust);min-height:16px;"></div>
      <div style="display:flex;gap:8px;">
        <label class="field" style="flex:1;"><span>Adet</span><input id="qty-${l.id}" type="number" value="${l.qty}" oninput="recalcLine('${l.id}')"></label>
        <label class="field" style="flex:1;"><span>Birim Fiyat KDV Hariç (₺)</span><input id="price-${l.id}" type="text" inputmode="decimal" value="${l.price}" oninput="recalcLine('${l.id}')"></label>
      </div>
      <div class="kdv-row"><input type="checkbox" id="kdv-${l.id}" ${l.kdvOn?'checked':''} onchange="recalcLine('${l.id}')"> KDV ekle <input type="number" id="kdvpct-${l.id}" value="${l.kdvPct}" oninput="recalcLine('${l.id}')"> %</div>
      <div class="line-total mono" id="total-${l.id}"></div>
    </div>`).join('');
  deliveryLines.forEach(l=>recalcLine(l.id));
}
function openProductPicker(lineId, customerId){
  captureDeliveryDraftMeta();
  const cards = state.products.map(p=>`
    <div class="product-pick" onclick="selectProductForLine('${lineId}','${p.id}','${customerId}')">
      ${p.image?`<img src="${p.image}" class="thumb">`:`<div class="ph">${ICONS.box2}</div>`}
      <div style="text-align:left;flex:1;"><strong>${p.name}</strong><div class="muted" style="font-size:11.5px;">KDV hariç ₺${tl(p.price)} · KDV dahil ₺${tl(p.price*1.2)}</div></div>
    </div>`).join('');
  openModal(`
    <div class="modal-bg" onclick="if(event.target===this)backToDelivery('${customerId}')">
      <div class="modal">
        <div class="modal-head"><h3>Ürün Seç</h3><button onclick="backToDelivery('${customerId}')">&times;</button></div>
        <div class="modal-body">
          ${state.products.length? cards : '<div class="empty">Henüz ürün eklenmedi. Önce Ürünler sekmesinden ekleyin.</div>'}
          <button class="btn ghost btn-full" style="margin-top:8px;" onclick="backToDelivery('${customerId}')">Listede Yok — Elle Yazacağım</button>
        </div>
      </div>
    </div>`);
}
function backToDelivery(customerId){
  const existing = editingMovementId ? state.movements.find(m=>m.id===editingMovementId) : null;
  openDeliveryModal(customerId, existing);
  setTimeout(restoreDeliveryDraftMeta, 30);
}
function selectProductForLine(lineId, productId, customerId){
  const l = deliveryLines.find(x=>x.id===lineId);
  const p = state.products.find(x=>x.id===productId);
  if(l&&p){ l.productId=p.id; l.name=p.name; l.price=p.price; l.kdvOn=true; l.kdvPct=VAT_DEFAULT; }
  backToDelivery(customerId);
}
function onLineNameInput(id){
  const l = deliveryLines.find(x=>x.id===id); if(!l) return;
  const val = document.getElementById('name-'+id).value;
  l.name = val;
  const match = state.products.find(p=>p.name.toLowerCase()===val.toLowerCase());
  if(match){ l.productId = match.id; l.kdvOn=true; l.kdvPct=VAT_DEFAULT; document.getElementById('price-'+id).value = match.price; document.getElementById('kdv-'+id).checked=true; document.getElementById('kdvpct-'+id).value=VAT_DEFAULT; recalcLine(id); }
  else { l.productId=''; }
}
function addDeliveryLine(customerId){ deliveryLines.push({id:uid(), productId:'', name:'', qty:1, price:0, kdvOn:true, kdvPct:VAT_DEFAULT}); renderDeliveryLines(customerId); }
function removeDeliveryLine(id, customerId){ deliveryLines = deliveryLines.filter(l=>l.id!==id); renderDeliveryLines(customerId); }
function recalcLine(id){
  const l = deliveryLines.find(x=>x.id===id); if(!l) return;
  l.name = document.getElementById('name-'+id)?.value ?? l.name;
  l.qty = Number(document.getElementById('qty-'+id)?.value || 0);
  l.price = parseAmount(document.getElementById('price-'+id)?.value || 0);
  l.kdvOn = document.getElementById('kdv-'+id)?.checked ?? l.kdvOn;
  l.kdvPct = Number(document.getElementById('kdvpct-'+id)?.value || 0);
  const finalUnit = l.kdvOn ? l.price*(1+l.kdvPct/100) : l.price;
  const lineTotal = l.qty*finalUnit;
  const totalEl = document.getElementById('total-'+id);
  if(totalEl) totalEl.innerHTML = l.qty && l.price ? `${l.qty} × ₺${tl(finalUnit)} = <strong>₺${tl(lineTotal)}</strong>` : '';
  const grand = deliveryLines.reduce((a,x)=>{ const fu = x.kdvOn ? x.price*(1+x.kdvPct/100) : x.price; return a + x.qty*fu; },0);
  const grandEl = document.getElementById('grand-total');
  if(grandEl) grandEl.textContent = '₺'+tl(grand);
}
let pendingDeliveryEdit = null;
function submitDelivery(customerId){
  const date = document.getElementById('f-date').value || today();
  const dueDate = document.getElementById('f-duedate').value || null;
  const paidEl = document.getElementById('f-paid');
  const paid = paidEl ? paidEl.checked : false;
  const invoiced = document.getElementById('f-invoiced').checked;
  const items = deliveryLines.filter(l=>l.qty>0 && l.price>=0 && l.name.trim()).map(l=>{
    const finalUnit = l.kdvOn ? l.price*(1+l.kdvPct/100) : l.price;
    return { productId: l.productId||null, name: l.name.trim(), qty:l.qty, unitPrice:finalUnit, lineTotal: l.qty*finalUnit };
  });
  if(!items.length) return;
  const total = items.reduce((a,i)=>a+i.lineTotal,0);
  const desc = items.map(i=>`${i.qty}x ${i.name}`).join(', ');
  if(editingMovementId){
    const m = state.movements.find(x=>x.id===editingMovementId);
    if(!m) return;
    captureDeliveryDraftMeta();
    pendingDeliveryEdit = { customerId, movementId: editingMovementId, date, dueDate, invoiced, items, total, desc };
    requirePin(()=>{ openDeliveryEditConfirm(m, pendingDeliveryEdit); });
    return;
  } else {
    items.forEach(it=>{ if(it.productId){ const p=state.products.find(p=>p.id===it.productId); if(p&&p.stock!=null) p.stock=Math.max(0,p.stock-it.qty); } });
    state.movements.push({id:uid(), customerId, date, dueDate, invoiced, type:'teslim', items, total, desc});
    if(paid){ state.movements.push({id:uid(), customerId, date, type:'odeme', total, desc:'Peşin ödeme'}); }
  }
  persist(); closeModal(); render();
}
function openDeliveryEditConfirm(oldM, newD){
  openModal(`
    <div class="modal-bg">
      <div class="modal">
        <div class="modal-head"><h3>Değişikliği Onaylayın</h3><button onclick="cancelDeliveryEdit('${newD.customerId}')">&times;</button></div>
        <div class="modal-body">
          <p class="muted" style="margin-bottom:14px;">Kaydetmeden önce eski ve yeni hâli karşılaştırın:</p>
          <div class="card" style="padding:12px 14px;margin-bottom:10px;">
            <div class="muted" style="font-size:11px;text-transform:uppercase;margin-bottom:4px;">Eski</div>
            <div style="font-size:13.5px;margin-bottom:4px;">${oldM.desc||'Teslimat'}</div>
            <div class="mono" style="font-size:17px;">₺${tl(oldM.total)}</div>
          </div>
          <div class="card" style="padding:12px 14px;margin-bottom:16px;border-left:4px solid var(--blue);">
            <div class="muted" style="font-size:11px;text-transform:uppercase;margin-bottom:4px;">Yeni</div>

    d.items.forEach(it=>{ if(it.productId){ const p=state.products.find(p=>p.id===it.productId); if(p&&p.stock!=null) p.stock=Math.max(0,p.stock-it.qty); } });
    m.date=d.date; m.dueDate=d.dueDate; m.invoiced=d.invoiced; m.items=d.items; m.total=d.total; m.desc=d.desc;

// ---------- backup / restore ----------
function downloadBackup(){
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'defterim-yedek-'+today()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function restoreBackupFile(input){
  const file = input.files && input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!data.customers || !data.movements){ alert('Bu dosya geçerli bir Defterim yedeği gibi görünmüyor.'); return; }
      if(!confirm('Mevcut verilerin üzerine yazılacak, emin misiniz?')) return;
      data.freeNotes = data.freeNotes || []; data.ledger = data.ledger || []; data.suppliers = data.suppliers || []; data.supplierMovements = data.supplierMovements || []; data.pin = data.pin || null; data.trash = data.trash || [];
      state = data; persist(); render();
      alert('Yedek başarıyla geri yüklendi.');
    }catch(err){ alert('Dosya okunamadı. Geçerli bir yedek dosyası seçtiğinizden emin olun.'); }
    input.value = '';
  };
  reader.readAsText(file);
}

function runGlobalVoice(){

            </div>
          </div>
          <div style="font-size:14px;line-height:1.4;margin-bottom:8px;">${isTeslim ? (m.desc||'Teslimat') : (m.desc||'Ödeme')} ${isTeslim && m.invoiced?`<span class="pill" style="background:rgba(47,122,77,.15);color:var(--green);margin-left:4px;">Fatura ✓</span>`:''}</div>
          <div style="display:flex;gap:8px;justify-content:flex-end;border-top:1.5px solid var(--linefaint);padding-top:8px;">
            <button class="btn ghost" style="padding:8px 14px;font-size:13px;" onclick="editMovement('${m.id}','${c.id}')">${ICONS.edit} Düzenle</button>
            <button class="btn ghost" style="padding:8px 14px;font-size:13px;color:var(--rust);border-color:var(--rust);" onclick="removeMovement('${m.id}')">${ICONS.trash} Sil</button>
          </div>
        </div>`;
      });
    }
    html += `<div class="card" style="padding:16px;">
      <h2 class="serif" style="font-size:16px;margin:0 0 10px;">Notlar</h2>
      <textarea id="note-text" placeholder="Bu müşteriyle ilgili hatırlamak istediklerinizi yazın…">${c.note||''}</textarea>
      <div style="display:flex; align-items:center; gap:10px; margin-top:8px;">
        <button class="btn dark" onclick="saveCustomerNote('${c.id}')">Notu Kaydet</button>
        <span class="muted" id="note-status"></span>
      </div>
    </div>`;
  }

  else if(view==='products'){
    html += `<h1 class="page">Ürünler</h1><p class="muted" style="margin-top:-2px;margin-bottom:14px;">Fiyatı KDV hariç girin, KDV dahil tutar otomatik hesaplanır. Farklı boylar (10L, 5L gibi) ayrı ürün olarak eklenir.</p>`;
    html += `<div class="fab-row"><button class="btn" onclick="modalProduct()">${ICONS.plus} Ürün Ekle</button></div>`;
    if(state.products.length===0){ html += `<div class="card"><div class="empty">Henüz ürün eklenmedi.</div></div>`; }
    else {
      state.products.forEach(p=>{
        html += `<div class="card" style="padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;">
          ${p.image?`<img src="${p.image}" class="thumb" style="width:48px;height:48px;">`:`<div class="thumb" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--muted);">${ICONS.box2}</div>`}
          <div style="flex:1;">
            <div style="font-weight:700;margin-bottom:2px;">${p.name}</div>
            <div class="muted" style="font-size:12.5px;">KDV hariç ₺${tl(p.price)} · <span style="color:var(--blue);font-weight:600;">KDV dahil ₺${tl(p.price*1.2)}</span></div>
            <div class="muted" style="font-size:11.5px;">Stok: ${p.stock==null?'—':p.stock}</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;">
            <button class="icon-btn edit" onclick="modalProduct('${p.id}')">${ICONS.edit}</button>
            <button class="icon-btn trash" onclick="removeProduct('${p.id}')">${ICONS.trash}</button>
          </div>
        </div>`;
      });
    }
  }

  else if(view==='accounts'){
    html += `<h1 class="page">Hesaplar</h1><p class="muted" style="margin-top:-2px;margin-bottom:14px;">Genel işletme gelir/gider takibi (kira, nakliye vb.). Müşteri borç/alacakları için Müşteriler sekmesine bakın.</p>`;
    html += `<div class="fab-row"><button class="btn ghost" onclick="setView('suppliers')">📦 Tedarikçiler</button><button class="btn" onclick="modalLedger()">${ICONS.plus} Gider Ekle</button></div>`;
    html += `<div class="grid3">${statCard('Satış Geliri', totalDeliveries, 'up', 'blue')}${statCard('Ek Gider', manualExpense, 'down', 'bordo', "modalExpenseBreakdown()")}${statCard('Net', netProfit, 'wallet', netProfit>=0?'green':'bordo')}</div>`;
    if(state.ledger.length===0){ html += `<div class="card"><div class="empty">Henüz elle eklenmiş bir kayıt yok.</div></div>`; }
    else {
      state.ledger.forEach(l=>{
        const isIncome = l.type==='gelir';
        html += `<div class="card" style="padding:14px 16px;margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;">
            <div>
              <div class="date-strong">${fmtDate(l.date)}</div>
              <span class="pill" style="background:${isIncome?'rgba(47,122,77,.15)':'rgba(123,45,62,.12)'};color:${isIncome?'var(--green)':'var(--rust)'};margin-top:4px;">${l.category}</span>
            </div>
            <div class="mono" style="font-size:17px;font-weight:700;color:${isIncome?'var(--green)':'var(--rust)'};">${isIncome?'+':'−'}₺${tl(l.amount)}</div>
          </div>
          <div style="font-size:14px;margin-bottom:8px;">${l.desc}${l.kdvOn?`<div class="muted" style="font-size:11px;">KDV hariç ₺${tl(l.baseAmount)} +%${l.kdvPct}</div>`:''}</div>
          <div style="display:flex;gap:8px;justify-content:flex-end;border-top:1.5px solid var(--linefaint);padding-top:8px;">
            <button class="btn ghost" style="padding:8px 14px;font-size:13px;" onclick="modalLedger('${l.id}')">${ICONS.edit} Düzenle</button>
            <button class="btn ghost" style="padding:8px 14px;font-size:13px;color:var(--rust);border-color:var(--rust);" onclick="removeLedger('${l.id}')">${ICONS.trash} Sil</button>
          </div>
        </div>`;
      });
    }
  }

  else if(view==='suppliers'){
    html += `<div class="fab-row" style="justify-content:space-between;"><button class="btn ghost" onclick="setView('accounts')">‹ Hesaplar</button><span></span></div>`;
    html += `<h1 class="page">Tedarikçiler</h1><p class="muted" style="margin-top:-2px;margin-bottom:14px;">Mal aldığınız firmalara olan borcunuzu takip edin.</p>`;
    html += `<div class="fab-row"><button class="btn" onclick="modalSupplier()">${ICONS.plus} Tedarikçi Ekle</button></div>`;
    if(state.suppliers.length===0){ html += `<div class="card"><div class="empty">Henüz tedarikçi eklenmedi.</div></div>`; }
    else {
      html += `<div class="card">`;
      state.suppliers.forEach(s=>{
        const bal = supplierBalance(s.id);
        const balColor = bal>0 ? 'var(--rust)' : (bal<0 ? 'var(--green)' : 'var(--muted)');
        const balLabel = bal>0 ? 'borcumuz var' : (bal<0 ? 'fazla ödemişiz' : 'hesap kapalı');
        html += `<div class="row clickable" onclick="openSupplier('${s.id}')">
          <div><div><strong>${s.name}</strong></div><div class="muted" style="font-size:11.5px;">${s.phone?telLink(s.phone):''}</div></div>
          <div style="text-align:right;"><div class="mono" style="color:${balColor};font-weight:700;">₺${tl(Math.abs(bal))}</div><div class="muted" style="font-size:10.5px;">${balLabel}</div></div>
        </div>`;
      });
      html += `</div>`;
    }
  }

  else if(view==='supplierDetail'){
    const s = state.suppliers.find(x=>x.id===selectedSupplierId);
    if(!s){ view='suppliers'; return render(); }
    const bal = supplierBalance(s.id);
    const balColor = bal>0 ? 'var(--rust)' : (bal<0 ? 'var(--green)' : 'var(--navy)');
    const balLabel = bal>0 ? 'Onlara borcumuz' : (bal<0 ? 'Fazla ödemişiz' : 'Hesap kapalı');
    html += `<div class="fab-row"><button class="btn ghost" onclick="modalSupplier('${s.id}')">${ICONS.edit} Tedarikçiyi Düzenle</button></div>`;
    html += `<div class="card" style="padding:22px 18px;text-align:center;margin-bottom:14px;"><div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.1em;">${balLabel}</div><div class="mono" style="font-size:32px;color:${balColor};">₺${tl(Math.abs(bal))}</div></div>`;
    html += `<div class="fab-row">
      <button class="btn dark" onclick="modalSupplierMovement('${s.id}','borc')">${ICONS.plus} Mal / Borç Ekle</button>
      <button class="btn" onclick="modalSupplierMovement('${s.id}','odeme')">${ICONS.plus} Ödeme Yaptım</button>
    </div>`;
    const rows = supplierMovementsOf(s.id);
    let running = 0;
    const withRunning = rows.map(m=>{ running += m.type==='borc' ? m.amount : -m.amount; return {...m, running}; });
    if(withRunning.length===0){ html += `<div class="card"><div class="empty">Henüz hareket yok.</div></div>`; }
    else {
      withRunning.slice().reverse().forEach(m=>{
        const isBorc = m.type==='borc';
        html += `<div class="card" style="padding:14px 16px;margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;">
            <div class="date-strong">${fmtDate(m.date)}</div>
            <div style="text-align:right;"><div class="mono" style="font-size:17px;font-weight:700;color:${isBorc?'var(--rust)':'var(--green)'};">${isBorc?'+':'−'}₺${tl(m.amount)}</div><div class="muted" style="font-size:11px;">Bakiye: ₺${tl(m.running)}</div></div>
          </div>
          <div style="font-size:14px;margin-bottom:8px;">${m.desc}</div>
          <div style="display:flex;gap:8px;justify-content:flex-end;border-top:1.5px solid var(--linefaint);padding-top:8px;">
            <button class="btn ghost" style="padding:8px 14px;font-size:13px;" onclick="editSupplierMovement('${m.id}','${s.id}')">${ICONS.edit} Düzenle</button>
            <button class="btn ghost" style="padding:8px 14px;font-size:13px;color:var(--rust);border-color:var(--rust);" onclick="removeSupplierMovement('${m.id}')">${ICONS.trash} Sil</button>
          </div>
        </div>`;
      });
    }
  }

  else if(view==='allnotes'){
    html += `<h1 class="page">Notlar</h1>`;
    html += `<h2 class="subhead" style="margin-top:0;">Genel Notlar</h2>`;
    html += `<div class="card" style="padding:16px;margin-bottom:20px;">
      <textarea id="free-note-input" placeholder="Aklınızdakini yazın…" style="margin-bottom:8px;"></textarea>
      <button class="btn dark" onclick="addFreeNote()">${ICONS.plus} Not Ekle</button>
    </div>`;
    if(state.freeNotes.length){
      html += `<div class="card" style="margin-bottom:20px;">`;
      state.freeNotes.forEach(n=>{ html += `<div class="row"><div><div>${n.text}</div><div class="date-strong">${fmtDate(n.date)}</div></div><button class="icon-btn trash" onclick="removeFreeNote('${n.id}')">${ICONS.trash}</button></div>`; });
      html += `</div>`;
    }
    html += `<h2 class="subhead">Müşteri Notları</h2><p class="muted" style="margin-top:-6px;">Müşteriye dokunarak notunu görüp düzenleyebilirsiniz.</p>`;
    html += `<div class="card">`;
    if(state.customers.length===0){ html += `<div class="empty">Henüz müşteri yok.</div>`; }
    else {
      state.customers.forEach(c=>{
        html += `<div class="row clickable" onclick="openCustomer('${c.id}')">
          <div><div><strong>${c.name}</strong></div><div class="muted" style="font-size:12px; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${c.note ? c.note : 'Not eklenmedi'}</div></div>
        </div>`;
      });
    }
    html += `</div>`;

    html += `<h2 class="subhead">🗑️ Son Silinenler (Çöp Kutusu)</h2><p class="muted" style="margin-top:-6px;">Silinen kayıtlar 30 gün burada bekler, isterseniz geri getirebilirsiniz.</p>`;
    html += `<div class="card">`;
    if(!state.trash.length){ html += `<div class="empty">Çöp kutusu boş.</div>`; }
    else {
      state.trash.forEach(t=>{
        html += `<div class="row"><div><div style="font-size:13.5px;">${trashLabel(t)}</div><div class="muted" style="font-size:11px;">Silinme: ${fmtDate(t.deletedAt)}</div></div><div style="display:flex;gap:6px;"><button class="btn ghost" style="padding:7px 12px;font-size:12.5px;" onclick="restoreTrash('${t.id}')">Geri Getir</button><button class="btn ghost" style="padding:7px 12px;font-size:12.5px;color:var(--rust);border-color:var(--rust);" onclick="permanentDeleteTrash('${t.id}')">Kalıcı Sil</button></div></div>`;
      });
    }
    html += `</div>`;
  }

  app.innerHTML = html;
  const nav = document.getElementById('bottomnav');
  const activeNav = view==='customerDetail' ? 'customers' : (view==='suppliers'||view==='supplierDetail') ? 'accounts' : view;
  nav.innerHTML = NAV.map(n=>`<button class="${activeNav===n.id?'active':''}" onclick="setView('${n.id}')">${ICONS[n.icon]}<span>${n.label}</span></button>`).join('');
}

render();
</script>
</body>
</html>
